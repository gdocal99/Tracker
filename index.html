<title>BLOCK 3 — Трекер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#060609;color:#F5F5F7;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:440px;margin:0 auto;padding:18px 16px 70px}
button{cursor:pointer;font-family:inherit;transition:transform .09s ease}
.row:active,.prayer-btn:active,.cat-header:active,.mark-btn:active,.wbtn:active,.task-check:active,.q-btn:active,.state-btn:active,.backup-btn:active,.export-btn:active,.nav-btn:active,.task-add:active,.vt-btn:active,.task-del:active{transform:scale(.96)}
.prayer-btn.on{box-shadow:0 0 10px rgba(129,140,248,.22)}
@keyframes crownPulse{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}50%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42),0 0 9px rgba(165,180,252,.6)}}
.hist-cell.crown-cell{animation:crownPulse 2.4s ease-in-out infinite}
input,textarea{font-family:inherit;color:#F5F5F7;background:#101017;border:1px solid #1B1B26;border-radius:10px;padding:9px 10px;font-size:14px;outline:none;width:100%}
textarea{resize:none}
input[type=range]{background:none;accent-color:#818CF8;width:100%;height:28px;padding:0}
.section-label{font-size:11px;letter-spacing:1.5px;color:#6B6B75;text-transform:uppercase;margin:20px 0 9px 2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:12px;background:#16161C;border:1px solid transparent;margin-top:7px;width:100%;text-align:left}
.row-label{font-size:14.5px;color:#A1A1AA;transition:color .15s}
.row-label.on{color:#F5F5F7}
.check-box{width:25px;height:25px;border-radius:8px;border:1.5px solid #3A3A45;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.check-box svg{display:none}.check-box.on svg{display:block}
.check-box.on{border-color:#818CF8;background:rgba(129,140,248,.20)}
.prayer-btn{position:relative;overflow:hidden;flex:1;padding:11px 2px;border-radius:12px;border:1px solid #1B1B26;background:#16161C;color:#A1A1AA;font-size:12.5px;font-weight:600;transition:all .15s}
.prayer-btn.on{border-color:#818CF8;background:rgba(129,140,248,.14);color:#818CF8}
.prayers-row{display:flex;gap:6px;margin-top:7px}
.step-btn{width:34px;height:34px;border-radius:10px;border:1px solid #1B1B26;background:#101017;color:#F5F5F7;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.water-count{font-size:15px;font-weight:700;min-width:118px;text-align:center}
.wbtn{flex:1;padding:9px 0;border-radius:10px;border:1px solid #1B1B26;background:#101017;color:#A1A1AA;font-size:13px;font-weight:600}
.tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag-fact{background:#1B1B26;color:#A8A29E}
.tag-sched{background:rgba(203,164,92,.14);color:#FBBF24}
/* Каждая категория — чётко очерченный блок (карта: ясно, что к чему относится). */
.cat-block{border:1px solid #1B1B26;border-radius:14px;background:#101017;overflow:hidden;margin-top:12px}
.cat-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 13px;border:none;border-radius:0;background:#101017;margin-top:0}
.cat-body{padding:2px 11px 12px}
.cat-name{font-size:15px;font-weight:700;color:#F5F5F7;letter-spacing:.2px}
.blk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;flex:0 0 auto;box-shadow:0 0 6px -1px currentColor}
/* Плавное «выезжание» тела блока при раскрытии (аккордеон) — глаз успевает проследить. */
@keyframes accOpen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cat-body-anim{animation:accOpen .26s cubic-bezier(.2,.7,.3,1)}
.cat-count{font-size:12.5px;color:#4ADE80;font-weight:600}
.tchip{margin-left:6px;color:#6B6B75;font-weight:700;padding:1px 5px;border-radius:6px;border:1px solid #1B1B26}
.tchip.lag{color:#FBBF24;border-color:#4A3821}
.wlog{display:flex;flex-wrap:wrap;gap:5px}
.wlog-e{font-size:11.5px;color:#A1A1AA;background:#16161C;border:1px solid #1B1B26;border-radius:7px;padding:3px 7px}
.wlog-e b{color:#818CF8;font-family:ui-monospace,Menlo,monospace}
.mrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid #1B1B26}
.msel{flex:0 0 92px;background:#16161C;border:1px solid #1B1B26;border-radius:9px;color:#F5F5F7;font-size:12.5px;padding:8px 6px}
.mval{flex:1;min-width:0}
.munit{flex:0 0 auto;font-size:11px;color:#6B6B75;min-width:32px}
.mtime{flex:0 0 92px}
.mlog{margin-top:8px;border-top:1px solid #1B1B26;padding-top:6px}
.mlog-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px}
.mlog-v{flex:1;color:#D4D4D8}
.mlog-v b{color:#F5F5F7}
.mlog-x{flex:0 0 30px;border-radius:8px;border:1px solid #1B1B26;background:#16161C;color:#6B6B75;font-size:12px;padding:5px 0}
.hud{border-bottom:1px solid #1B1B26;padding:3px 2px;margin:0 0 6px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-day{font-size:13.5px;font-weight:700;color:#F5F5F7}
.hud-bal{font-size:19px;font-weight:800;color:#818CF8;font-family:ui-monospace,Menlo,monospace}
.hud-unit{font-size:11px;color:#6B6B75;margin-left:1px}
.hud-earn{font-size:11.5px;color:#FBBF24;margin-left:6px;font-weight:700}
.hud-sub{font-size:11.5px;color:#A1A1AA;margin-top:2px}
.hud-life{color:#FBBF24;font-family:ui-monospace,Menlo,monospace}
.gear{position:absolute;top:12px;right:14px;z-index:50;width:42px;height:42px;border-radius:12px;border:1px solid #1B1B26;background:#16161C;color:#A1A1AA;font-size:19px}
.gear-bad{border-color:#F87171;color:#F87171}
.gear-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#F87171}
/* Тихий индикатор облака: маленькая точка слева от шестерёнки. Не отвлекает. */
.cloud-dot{position:absolute;top:23px;right:62px;z-index:50;width:8px;height:8px;border-radius:50%;background:#6B6B75;display:none}
@keyframes cloudPulse{0%,100%{opacity:.45}50%{opacity:1}}
.cloud-dot.cloud-pulse{animation:cloudPulse 1.1s ease-in-out infinite}
.log-card{background:#101017;border:1px solid #1B1B26;border-radius:14px;margin:10px 0 4px;overflow:hidden}
.log-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:none;border:none;color:#F5F5F7;font-size:13.5px;font-weight:700}
.log-list{padding:0 13px 10px;max-height:300px;overflow-y:auto}
.log-row{display:flex;gap:10px;padding:5px 0;border-top:1px solid #1B1B26;font-size:12.5px}
.log-t{flex:0 0 40px;color:#818CF8;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.log-e{color:#D4D4D8;line-height:1.45}
.sub-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#4ADE80;margin:12px 0 4px 4px;font-weight:700}
.daypart{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 11px;border-radius:11px;margin:13px 0 5px}
.daypart .daypart-ic{font-size:14px}
.daypart.morning{background:linear-gradient(90deg,rgba(203,164,92,.16),rgba(203,164,92,.02));color:#FBBF24;border:1px solid rgba(203,164,92,.28);border-left:3px solid #FBBF24}
.daypart.evening{background:linear-gradient(90deg,rgba(126,148,196,.16),rgba(126,148,196,.02));color:#60A5FA;border:1px solid rgba(126,148,196,.28);border-left:3px solid #60A5FA}
.sup-arch-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;color:#6B6B75;font-size:12px;font-weight:600;padding:8px 2px 4px}
.sup-paused{opacity:.6}
.sup-course{font-size:10.5px;color:#6B6B75;margin-top:2px}
.sups-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:2px 0}
.sub-label:first-child{margin-top:6px}
.sub-label.sub-fact{color:#6B6B75;letter-spacing:.6px;border-top:1px solid #1B1B26;padding-top:9px;margin-top:14px}
.muted-note{font-size:13px;color:#6B6B75;padding:10px 4px}
.sched-cap{font-size:12px;color:#A8A29E;padding:10px 4px 2px;line-height:1.5}
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.toggle-track{width:46px;height:27px;border-radius:14px;background:#1B1B26;position:relative;transition:.15s;flex-shrink:0}
.toggle-track.on{background:rgba(129,140,248,.3)}
.toggle-track.danger.on{background:rgba(224,121,91,.3)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:11px;background:#6B6B75;transition:.15s}
.toggle-track.on .toggle-thumb{left:22px;background:#818CF8}
.toggle-track.danger.on .toggle-thumb{left:22px;background:#F87171}
.state-btn{padding:7px 12px;border-radius:10px;font-size:13px;border:1px solid #1B1B26;background:#101017;color:#A1A1AA}
.state-btn.on{border-color:#818CF8;background:rgba(129,140,248,.12);color:#818CF8}
.expand-btn{width:100%;margin-top:14px;padding:13px 15px;border-radius:13px;background:#16161C;border:1px solid #1B1B26;color:#A1A1AA;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.details-inner{background:#16161C;border:1px solid #1B1B26;border-radius:15px;padding:15px;margin-top:8px;display:flex;flex-direction:column;gap:14px}
.dcard{background:#101017;border:1px solid #1B1B26;border-radius:16px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:12px}
.dcard-h{font-size:13.5px;font-weight:800;color:#F5F5F7;letter-spacing:.3px}
.slip-indent{padding-left:10px;border-left:2px solid #1B1B26;display:flex;flex-direction:column;gap:10px}
.field-label{font-size:12px;color:#A1A1AA;margin-bottom:6px}
.field-row{display:flex;gap:10px}
.field-item{flex:1;min-width:0}
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-header{display:flex;justify-content:space-between}
.slider-val{font-size:14.5px;font-weight:700;color:#818CF8}
.slider-val.muted{color:#6B6B75;font-weight:600;font-size:12px}
.slider-row.unset input[type=range]{opacity:.4}
.states-row{display:flex;gap:6px;flex-wrap:wrap}
.export-btn{width:100%;margin-top:14px;padding:13px;border-radius:13px;background:rgba(129,140,248,.10);border:1px solid #6366F1;color:#818CF8;font-size:15px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px}
.backup-row{display:flex;gap:10px;margin-top:10px}
.backup-btn{flex:1;padding:11px;border-radius:12px;background:#16161C;border:1px solid #1B1B26;color:#A1A1AA;font-size:13px;font-weight:600}
.header-card{border-radius:20px;border:1px solid #1B1B26;padding:16px;transition:background .5s}
.topbar{position:sticky;top:0;z-index:40;background:#060609;padding:7px 0 8px;margin-bottom:10px;border-bottom:1px solid #1B1B26}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 40px 0 2px}
.db-ring{position:relative;width:40px;height:40px;flex-shrink:0}
.db-ring svg{position:absolute;inset:0}
.db-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.db-bal{font-size:12px;font-weight:700;color:#FBBF24;flex-shrink:0;text-align:right;min-width:44px}
.dstrip{display:flex;gap:3px;padding:7px 2px 0}
.dcell{flex:1;height:20px;border-radius:5px;border:1px solid #1B1B26;background:#16161C;cursor:pointer;font-size:9px;line-height:18px;text-align:center;padding:0}
.dcell.sel{border:1.5px solid #FBBF24}
.datebar-c{display:flex;align-items:baseline;gap:8px}
.datebar-dow{font-size:12px;color:#A1A1AA;text-transform:uppercase;letter-spacing:.5px}
.datebar-txt{font-size:18px;font-weight:700;color:#F5F5F7}
.q-btn.active{border-color:#4ADE80;color:#4ADE80;background:rgba(121,169,141,.14)}
.nav-row{display:flex;align-items:center;justify-content:space-between}
.nav-btn{width:38px;height:38px;border-radius:11px;border:none;background:transparent;color:#A1A1AA;font-size:22px;display:flex;align-items:center;justify-content:center}
.nav-btn:disabled{opacity:.25}
.date-center{text-align:center}
.date-dow{font-size:12px;letter-spacing:1.5px;color:#A1A1AA;text-transform:uppercase}
.date-txt{font-size:21px;font-weight:700}
.stats-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.ring-wrap{position:relative;width:112px;height:112px;flex-shrink:0}
.ring-wrap svg{position:absolute;top:0;left:0}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:25px;font-weight:800}
.ring-sub{font-size:10px;color:#A1A1AA}
.ring-cap{font-size:11.5px;color:#A1A1AA;margin-top:8px;text-align:center}
.ring-cap b{font-weight:700}
.streak-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.streak-txt{font-size:14.5px;font-weight:600}
.earn-label{font-size:13px;color:#A1A1AA}
.earn-val{font-size:19px;font-weight:700;color:#FBBF24}
.bal-txt{font-size:12px;color:#A1A1AA;margin-top:4px}
.bal-num{color:#F5F5F7;font-weight:600}
.hist-row{display:flex;gap:3px;flex-wrap:wrap}
.hist-cell{width:calc(12.5% - 3px);height:22px;border-radius:5px;border:1px solid #1B1B26;background:#16161C;cursor:pointer}
.hist-cell.sel{border:1.5px solid #FBBF24}
.hist-cell.skip-cell{border:1px dashed rgba(224,121,91,.5);opacity:.9}
.hist-month{font-size:12px;color:#A1A1AA;font-weight:600;margin:13px 0 6px 2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal-box{background:#16161C;width:100%;max-width:440px;border-radius:20px 20px 0 0;border:1px solid #1B1B26;padding:18px;max-height:80vh;display:flex;flex-direction:column}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:16px;font-weight:700}
.modal-hint{font-size:12.5px;color:#A1A1AA;margin-bottom:10px}
.copy-btn{margin-top:12px;padding:13px;border-radius:13px;border:none;background:#818CF8;color:#16161C;font-size:15px;font-weight:700;width:100%}
.mark-row{display:flex;gap:6px;margin-top:4px}
.mark-btn{flex:1;padding:10px 4px;border-radius:12px;border:1px solid #1B1B26;background:#16161C;color:#A1A1AA;font-size:13px;font-weight:600}
.banner{border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.5;margin-bottom:6px}
.banner-empty{background:rgba(203,164,92,.10);border:1px solid #4A3821;color:#FBBF24}
.banner-warn{background:rgba(224,121,91,.12);border:1px solid #4A2020;color:#FDBA74}
.banner b{color:#fff}
.auto-save{text-align:center;font-size:11px;color:#6B6B75;margin-top:22px;line-height:1.6}
.vt-row{display:flex;gap:5px;justify-content:flex-end;margin-bottom:10px}
.vt-btn{padding:6px 11px;border-radius:9px;border:1px solid #1B1B26;background:#16161C;color:#A1A1AA;font-size:12px;font-weight:600}
.vt-btn.on{border-color:#818CF8;color:#818CF8;background:rgba(129,140,248,.12)}
.side-title{display:none}
#app.mode-mobile .grid{display:block}
#app.mode-desktop{max-width:1080px}
#app.mode-desktop .grid{display:block;margin-top:16px}
/* Жёсткая сетка: два фиксированных столбца, каждый блок всегда на своём месте (предсказуемо
   для СДВГ — не надо искать, где что). Никакого masonry-перетекания. */
#app.mode-desktop .cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
#app.mode-desktop .cats-col{min-width:0}
#app.mode-desktop .cat-header{margin-top:0}
#app.mode-desktop .cat-block{min-width:0;margin:0 0 14px}
#app.mode-desktop .col-side{position:sticky;top:16px;display:flex;flex-direction:column}
#app.mode-desktop .col-side .side-title{display:block;font-size:13px;font-weight:700;color:#F5F5F7;margin:0 0 10px 2px;letter-spacing:.3px}
#app.mode-desktop .details-inner{margin-top:0}
#app.mode-desktop .export-btn,#app.mode-desktop .backup-row{margin-top:12px}
#app.mode-desktop .header-card{padding:20px 22px}

.field-ta{width:100%;background:#101017;color:#F5F5F7;border:1px solid #1B1B26;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;min-height:110px;resize:vertical;line-height:1.5;box-sizing:border-box}
/* Свёртываемое поле дневника: закрыто по умолчанию, при открытии растёт по мере ввода (запас 5 строк). */
.ta-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:12px;background:#16161C;border:1px solid #1B1B26;color:#D4D4D8;font-size:13.5px;font-weight:600;text-align:left}

.meas-card{background:#101017;border:1px solid transparent;border-radius:14px;padding:12px;margin-top:14px}
.cf{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:cfFall linear forwards}
.cat-pulse{animation:catGlow .7s ease}
@keyframes catGlow{0%{box-shadow:0 0 0 0 rgba(129,140,248,.5)}70%{box-shadow:0 0 0 16px rgba(129,140,248,0)}100%{box-shadow:0 0 0 0 rgba(129,140,248,0)}}
@keyframes cfFall{to{transform:translateY(108vh) rotate(720deg)}}
/* === Отклик на действие: МЕДЛЕННЫЕ, плавные, приятные волны + мягкое свечение. Клипуются
   границами пункта (overflow:hidden по rect), НЕ перекрывают текст (лежат в fx-box поверх, но
   полупрозрачны и быстро гаснут). Награда — только за хорошее; за плохое — отдельный тихий отклик. === */
.fx-box{position:fixed;overflow:hidden;pointer-events:none;z-index:80;border-radius:12px}
.fx-wave{position:absolute;border-radius:50%;border:2px solid var(--c,#818CF8);transform:translate(-50%,-50%) scale(.18);opacity:0;animation:fxWave var(--d,1s) cubic-bezier(.22,.61,.36,1) forwards}
@keyframes fxWave{0%{transform:translate(-50%,-50%) scale(.18);opacity:0}20%{opacity:var(--o,.65)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* Мягкое свечение из точки касания — тёплый «выдох», не вспышка. */
.fx-glow{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),var(--c,#818CF8),transparent 68%);opacity:0;animation:fxGlow var(--d,1s) ease-out forwards}
@keyframes fxGlow{0%{opacity:0}28%{opacity:.22}100%{opacity:0}}
/* Отклик на «плохое» действие (срыв, провал, сладкое, игры) — тихий приглушённый рубиновый вдох. */
.fx-neg{position:absolute;inset:0;background:var(--c,#F87171);opacity:0;animation:fxNeg .55s ease-out forwards}
@keyframes fxNeg{0%{opacity:0}35%{opacity:.16}100%{opacity:0}}
/* РАЗНЫЕ отклики под разные категории — чтобы не однотипно. Все спокойные и клипуются пунктом. */
/* Цветение (намаз, общение): лепестки мягко распускаются из точки и тают. */
.fx-petal{position:absolute;width:8px;height:8px;border-radius:64% 0 64% 0;background:var(--c,#FBBF24);transform:translate(-50%,-50%) scale(0) rotate(var(--r,0deg));opacity:0;animation:fxPetal 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxPetal{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(var(--r,0deg))}30%{opacity:.9;transform:translate(calc(-50% + var(--dx,0px)*.5),calc(-50% + var(--dy,0px)*.5)) scale(1) rotate(var(--r,0deg))}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(.7) rotate(var(--r,0deg))}}
/* Рябь (вода): несколько тонких колец, помедленнее — «капля упала». */
.fx-ripple{position:absolute;border-radius:50%;border:1.5px solid var(--c,#38BDF8);transform:translate(-50%,-50%) scale(.1);opacity:0;animation:fxRipple var(--d,1.1s) cubic-bezier(.15,.6,.3,1) forwards}
@keyframes fxRipple{0%{transform:translate(-50%,-50%) scale(.1);opacity:0}18%{opacity:.5}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* Пульс (тело/здоровье): мягкий энергичный «удар сердца». */
.fx-pulse{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--c,#34D399),transparent 62%);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:fxPulse .7s ease-out forwards}
@keyframes fxPulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:.45}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* Скольжение блика (быт): мягкий луч проходит по пункту. */
.fx-sweep{position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,var(--c,#2DD4BF) 50%,transparent 68%);opacity:0;transform:translateX(-45%);animation:fxSweep .85s ease-out forwards;mix-blend-mode:screen}
@keyframes fxSweep{0%{opacity:0;transform:translateX(-45%)}25%{opacity:.5}100%{opacity:0;transform:translateX(45%)}}
/* Постоянные цветы на выполненном намазе — остаются, пока намаз отмечен, внутри кнопки */
.pbloom-wrap{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;border-radius:11px}
.pbloom{position:absolute}.pbloom.pet{border-radius:64% 0 64% 0}
.pb-fg{position:relative;z-index:1;display:block}
.row{transition:background .3s ease,border-color .3s ease}
.row.on{background:rgba(129,140,248,.13);border-color:rgba(129,140,248,.5)}
.task-check{transition:background .3s ease,border-color .3s ease}
@keyframes checkPop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.check-box.just{animation:checkPop .35s ease}
.task-box.just{animation:checkPop .35s ease}
@keyframes btnPop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.prayer-btn.just{animation:btnPop .3s ease}
.dcell,.hist-cell{transition:transform .15s ease}
.dcell:hover,.hist-cell:hover{transform:scale(1.12)}
.pt-pop{position:fixed;top:54px;right:18px;font-size:16px;font-weight:800;z-index:60;pointer-events:none;animation:ptPop .9s ease forwards}
@keyframes ptPop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-24px)}}
.db-ring{transition:filter .5s ease}
.db-ring.glow-lo{filter:drop-shadow(0 0 2px rgba(129,140,248,.3))}
.db-ring.glow-mid{filter:drop-shadow(0 0 5px rgba(129,140,248,.45))}
.db-ring.glow-hi{filter:drop-shadow(0 0 9px rgba(129,140,248,.6))}
@keyframes streakBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.streak-tag.tier1{display:inline-block;animation:streakBounce 1.5s ease-in-out infinite}
@keyframes streakFlash{0%,100%{text-shadow:none}50%{text-shadow:0 0 7px rgba(129,140,248,.65)}}
.streak-tag.tier2{display:inline-block;animation:streakFlash 2s ease-in-out infinite;color:#818CF8;font-weight:700}
.streak-tag.tier3{display:inline-block;color:#FBBF24;font-weight:700;text-shadow:0 0 9px rgba(203,164,92,.55)}
.toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.92);background:rgba(18,24,19,.97);border:1px solid #6366F1;color:#818CF8;padding:14px 24px;border-radius:16px;font-size:15px;font-weight:700;z-index:70;pointer-events:none;animation:toastPop 1.8s ease forwards;white-space:nowrap}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
/* Тихая плашка «доступно обновление» — снизу по центру, не перекрывает контент, легко нажать. */
.upd-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:75;background:rgba(18,24,19,.98);border:1px solid #6366F1;color:#A5B4FC;padding:9px 10px 9px 16px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:0 6px 22px rgba(0,0,0,.45);display:flex;align-items:center;gap:10px;animation:updIn .4s ease;max-width:calc(100% - 24px)}
.upd-go{padding:9px 16px;border-radius:10px;border:none;background:#818CF8;color:#0B0B12;font-size:13.5px;font-weight:800}
.upd-x{width:34px;height:34px;border-radius:10px;border:1px solid #1B1B26;background:#16161C;color:#8B8B95;font-size:13px;font-weight:700;flex:0 0 auto}
@keyframes updIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* Кнопка «↩ Сегодня» под датой — быстрый возврат из прошлого. */
.today-btn{display:block;margin:8px auto 0;padding:5px 14px;border-radius:10px;border:1px solid rgba(129,140,248,.5);background:rgba(129,140,248,.12);color:#A5B4FC;font-size:12px;font-weight:700}

  for(const id of new Set([...K(before.quality),...K(after.quality)]))if((before.quality||{})[id]!==(after.quality||{})[id])t["q:"+id]=ts;
  for(const id of new Set([...K(before.opts),...K(after.opts)]))if(je((before.opts||{})[id],(after.opts||{})[id]))t["o:"+id]=ts;

function ensureWeather(dk){
  const cur=getWeather(dk);
  if(cur&&(cur.done||cur.manual))return;
  if(dk>todayKey())return;
  if(dk<addDays(todayKey(),-90))return;
  if(weatherPending[dk]||weatherFailed[dk]||weatherTried[dk])return;
  if(typeof fetch!=="function"){weatherFailed[dk]=1;return;}
  weatherPending[dk]=1;
  // Тянем не только температуру и код погоды, но и то, что реально влияет на самочувствие:
  // влажность, атм. давление, ветер, осадки. Всё по 4 точкам дня (утро/день/вечер/ночь).
  const hourly="temperature_2m,weather_code,relative_humidity_2m,surface_pressure,wind_speed_10m,precipitation,cloud_cover,uv_index";
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${PT_LAT}&longitude=${PT_LNG}&hourly=${hourly}&timezone=Europe%2FUzhgorod&start_date=${dk}&end_date=${dk}`;
  let req;
  try{req=fetch(url);}catch(e){weatherFailed[dk]=1;delete weatherPending[dk];return;}
  if(!req||typeof req.then!=="function"){weatherFailed[dk]=1;delete weatherPending[dk];return;}
  req.then(r=>r.json()).then(j=>{
    if(j&&j.hourly&&Array.isArray(j.hourly.time)){
      const H=j.hourly,times=H.time,temp=H.temperature_2m||[],code=H.weather_code||[];
      const rhA=H.relative_humidity_2m||[],pA=H.surface_pressure||[],wsA=H.wind_speed_10m||[],prA=H.precipitation||[],ccA=H.cloud_cover||[],uvA=H.uv_index||[];
      const out={h:WEATHER_HOURS.slice(),t:[],c:[],rh:[],p:[],ws:[],pr:[],cc:[],uv:[],done:dk<todayKey()};
      let got=0;

        out.c.push((idx>=0&&code[idx]!=null)?code[idx]:null);
        out.rh.push(pick(rhA,true));
        out.p.push(pick(pA,true));
        out.ws.push(pick(wsA,true));
        out.pr.push((idx>=0&&prA[idx]!=null)?Math.round(prA[idx]*10)/10:null);
        out.cc.push(pick(ccA,true));

}
// Компактная сводка дополнительных параметров: влажность (диапазон), давление (среднее),
// максимальный ветер, суммарные осадки. Старые дни без этих полей — просто пустая строка.
function weatherSummaryTxt(w){
  if(!w)return "";
  const nums=a=>(Array.isArray(a)?a:[]).map(Number).filter(Number.isFinite);
  const rh=nums(w.rh),p=nums(w.p),ws=nums(w.ws),pr=nums(w.pr),cc=nums(w.cc);
  const parts=[];
  if(rh.length)parts.push("💧 "+(Math.min(...rh)===Math.max(...rh)?Math.max(...rh):Math.min(...rh)+"–"+Math.max(...rh))+"%");
  if(cc.length)parts.push("☁️ "+Math.round(cc.reduce((a,x)=>a+x,0)/cc.length)+"% облачн.");
  if(p.length)parts.push("🔽 "+Math.round(p.reduce((a,x)=>a+x,0)/p.length)+" гПа");
  if(ws.length)parts.push("🌬 до "+Math.max(...ws)+" км/ч");
  if(pr.length){const s=pr.reduce((a,x)=>a+x,0);parts.push(s>0.05?("🌧 "+s.toFixed(1)+" мм осадков"):"☂️ без осадков");}
  return parts.join(" · ");
}

const BLOCKER_APPS=[["appblock","AppBlock","phone","📱"],["blockerhero","Blocker Hero","phone","📱"],["coldturkey","Cold Turkey","laptop","💻"],["other","Другое","other","🛡"]];

// Точность до минуты (не до календарного дня): "1 день" в старой логике мог означать
// как 23 часа 59 минут, так и 1 минуту до истечения — вводило в заблуждение. Здесь и
// дальше всё считается в миллисекундах от текущего момента, дни — дробные для порогов.
function blockerMsLeft(until){if(!until)return 0;return new Date(until).getTime()-Date.now();}
function blockerDaysLeft(until){return blockerMsLeft(until)/86400000;}
// Отдельный тир для «меньше суток, но ещё не истекла» — раньше это сливалось с
// «уже истекла» под одной надписью, что при минутной точности буквально врёт
// («Истекла», когда на деле ещё 40 минут). Теперь эти два разных состояния различимы.
function blockerStatus(dl){if(dl>=5)return{lbl:"🟢 Активна",c:"#4ADE80"};if(dl>=1)return{lbl:"🟡 Продли",c:"#FBBF24"};if(dl>0)return{lbl:"🟠 Скоро истечёт",c:"#FB923C"};return{lbl:"🔴 Истекла",c:"#F87171"};}
// Форматирование остатка: полная форма ("6 дн 4 ч") для карточки/отчёта, короткая
// ("6д"/"4ч"/"12м") для компактного чипа в шапке. Принимают |ms| — знак решает вызывающий.
function blockerFmtLeft(ms){
  const abs=Math.abs(ms),totalMin=Math.floor(abs/60000);
  const d=Math.floor(totalMin/1440),h=Math.floor((totalMin%1440)/60),m=totalMin%60;
  if(d>0)return `${d} дн ${h} ч`;
  if(h>0)return `${h} ч ${m} мин`;
  return `${m} мин`;
}
function blockerFmtShort(ms){
  const abs=Math.abs(ms),totalMin=Math.floor(abs/60000);
  const d=Math.floor(totalMin/1440);
  if(d>0)return `${d}д`;
  const h=Math.floor(totalMin/60);
  if(h>0)return `${h}ч`;
  return `${totalMin}м`;
}

function nowDT(){const d=new Date();const p=x=>String(x).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}

function changeSup(id,n){

function setSupTotal(id,v,step){

function lastWeight(k){const ks=Object.keys(days).filter(d=>d<=k).sort();for(let i=ks.length-1;i>=0;i--){const w=Number(days[ks[i]]?.weight);if(w)return w;}return 63;}
function dayAvgTemp(k){const wx=getWeather(k);if(!wx||!Array.isArray(wx.t))return null;const ts=wx.t.filter(x=>x!=null&&x!=="").map(Number).filter(Number.isFinite);if(!ts.length)return null;return ts.reduce((a,x)=>a+x,0)/ts.length;}
function dayAvgHum(k){const wx=getWeather(k);if(!wx||!Array.isArray(wx.rh))return null;const hs=wx.rh.filter(x=>x!=null&&x!=="").map(Number).filter(Number.isFinite);if(!hs.length)return null;return hs.reduce((a,x)=>a+x,0)/hs.length;}
// Динамическая цель воды: вес·32 + активность·300 + поправки по фактической погоде (t° и влажность).
// Без погоды — сезонный фолбэк по месяцу. Округление до 250 мл, минимум 1500.
function waterTarget(day,k){
  const w=Number(day.weight)||lastWeight(k)||63;let ml=w*32;
  const act=["workout","jumprope","swim","abs","cold","stretch","neck","fastwalk"];
  const n=act.filter(id=>day.items?.[id]).length;ml+=n*300;
  const avg=dayAvgTemp(k),hum=dayAvgHum(k);
  if(avg!=null){if(avg>25)ml+=500;else if(avg>20)ml+=250;}
  else{const m=Number((k||todayKey()).split("-")[1]);if(m>=6&&m<=8)ml+=500;else if(m===5||m===9)ml+=250;}
  if(hum!=null&&hum<40)ml+=250; // сухой воздух — пьём больше
  return Math.max(1500,Math.round(ml/250)*250);

function layoutBlocks(blocks,mode){

function selfTest(){

// === Конструктор привычек: пользователь сам добавляет пункты в любой блок ===
// Кастомные пункты живут в meta.customItems и «вживляются» в CATEGORIES, поэтому все
// расчёты (баллы, счётчики, отчёт, крестик) подхватывают их автоматически.
function applyCustomItems(){
  for(const cat of CATEGORIES)cat.items=cat.items.filter(it=>!it.custom);
  for(const ci of (meta.customItems||[])){
    if(!ci||!ci.cat||!ci.label)continue;
    const cat=CATEGORIES.find(c=>c.id===ci.cat);
    if(!cat)continue;
    const it={id:ci.id,label:ci.label,type:ci.type||"ob",pts:Number(ci.pts)||0,custom:true};
    if(ci.pen&&it.type!=="fact")it.pen=1;
    if(Array.isArray(ci.sched)&&ci.sched.length>0&&ci.sched.length<7)it.sched=ci.sched.slice();
    if(ci.part)it.part=ci.part;
    cat.items.push(it);
  }
}

function copyToClipboard(text,onOk,onFail){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(onOk).catch(()=>copyViaTextarea(text,onOk,onFail));}
  else copyViaTextarea(text,onOk,onFail);

function copyViaTextarea(text,onOk,onFail){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.top="-1000px";ta.style.left="0";ta.setAttribute("readonly","");
  document.body.appendChild(ta);
  try{ta.focus();ta.select();ta.setSelectionRange(0,text.length);const ok=document.execCommand("copy");document.body.removeChild(ta);if(ok)onOk();else onFail();}
  catch(e){try{document.body.removeChild(ta);}catch(e2){}onFail();}
}

function copyBackup(){const payload=JSON.stringify({_app:"block3",_v:VERSION,_exported:new Date().toISOString(),days,meta:backupMeta()});copyToClipboard(payload,()=>{meta.lastBackup=Date.now();saveMeta();vib(15);toast("📋 Скопировано");render();},()=>{toast("Буфер не сработал — скопируй вручную");});}// Надёжное скачивание копии: сначала обычная загрузка файла (работает на компе и Android).
// На iOS, где download-атрибут игнорируется, — запасной путь через «Поделиться». Всегда даём
// понятный отклик тостом, чтобы кнопка не казалась «мёртвой».
function saveBackup(auto){
  const payload={_app:"block3",_v:VERSION,_exported:new Date().toISOString(),days,meta:backupMeta()};
  const text=JSON.stringify(payload);
  const fname=`block3-backup-${todayKey()}${auto?"-auto":""}.json`;
  meta.lastBackup=Date.now();saveMeta();
  const iOS=/iP(hone|ad|od)/.test(navigator.platform||"")||(/Mac/.test(navigator.platform||"")&&navigator.maxTouchPoints>1);
  // На iOS скачивание файла ненадёжно — сразу пробуем «Поделиться» (можно сохранить в Файлы).
  if(!auto&&iOS&&navigator.share){
    try{const file=new File([text],fname,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:fname}).then(()=>toast("💾 Копия сохранена")).catch(()=>{});
        return;
      }
    }catch(e){}
  }
  let ok=false;
  try{
    const blob=new Blob([text],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=fname;a.rel="noopener";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{document.body.removeChild(a);URL.revokeObjectURL(url);}catch(e){}},150);
    ok=true;
  }catch(e){logError("backup-download",e);}
  if(!auto){
    if(ok){vib(12);toast("💾 Копия скачана в «Загрузки»");}
    else{ // совсем не вышло — спасаем в буфер, чтобы данные точно не потерялись
      copyToClipboard(text,()=>{vib(12);toast("💾 Скачать не вышло — копия в буфере");},()=>toast("Не удалось сохранить копию"));
    }
    render();
  }
}

// Слияние на уровне ПОЛЕЙ (field-level LWW). Каждая единица (пункт, намаз, поле, группа)
// имеет свою метку времени в day.t; побеждает та сторона, где эта единица изменена позже.
// Так отметка воды с телефона и абзац рефлексии с ноута не затирают друг друга.
// Обратная совместимость: у старых дней нет day.t → падаем на day.lastUpdated (прежний LWW).
// Строим полную карту меток времени по единицам. Если у единицы есть явная метка (day.t) —
// берём её; если нет, но значение отличается от пустого — считаем, что её задали в lastUpdated
// (это оживляет field-level даже для старых дней без day.t). Пустые/нетронутые единицы метки не

  for(const id in (d.prayers||{}))setIf("p:"+id);
  for(const id in (d.quality||{}))setIf("q:"+id);
  for(const id in (d.opts||{}))setIf("o:"+id);

// Объединение массивов-логов при слиянии устройств. Ключ — ПОЛНОЕ содержимое записи (у логов нет
// уникального row-id: поле id у БАДов = тип БАДа, а не строки). Одинаковые записи схлопываются в
// одну, разные — сохраняются ОБЕ. Так обед с телефона и ужин с ноута оба живут, ничего не теряется.

  for(const x of B){const k=key(x);if(seen.has(k))continue;seen.add(k);out.push(x);}
  return out;
}

  // записям, а не перезаписываем целиком: обед с телефона + ужин с ноута теперь оба сохраняются.

// Слияние meta из бэкапа: цели/задачи и кастомные БАДы — по id (без дублей), курсы — по ключу.
function mergeMetaIn(im,replace){

    if(replace)meta.customTasks=im.customTasks.slice();

  }
  if(Array.isArray(im.customItems)){
    if(replace)meta.customItems=im.customItems.slice();
    else{const have=new Set((meta.customItems||[]).map(t=>t.id));meta.customItems=[...(meta.customItems||[]),...im.customItems.filter(t=>t&&t.id&&!have.has(t.id))];}

    else{const have=new Set((meta.blockers||[]).map(b=>b.id));meta.blockers=[...(meta.blockers||[]),...im.blockers.filter(b=>b&&b.id&&!have.has(b.id))];}
  }
  if(Array.isArray(im.blockerLog)){
    if(replace)meta.blockerLog=im.blockerLog.slice();
    else{const seen=new Set((meta.blockerLog||[]).map(x=>x.t+"|"+x.name));meta.blockerLog=[...(meta.blockerLog||[]),...im.blockerLog.filter(x=>x&&!seen.has(x.t+"|"+x.name))];}

  if(im.checkinEve)meta.checkinEve=im.checkinEve;

function applyImport(mode){if(!pendingImport)return;

      else if(!dayIsEmpty(pendingImport.days[k])){days[k]=mergeDayDeep(days[k],repairDay(pendingImport.days[k]));combined++;}
    }

/* ============================================================================
   ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ — Firebase (Offline-First, Cloud-Synced)
   ----------------------------------------------------------------------------
   Философия: локальный LocalStorage — единственный источник правды для UI.
   Firebase (Firestore + Auth) — тихий фоновый транспорт между устройствами.

   • Никаких кнопок «синхронизировать вручную» — только тихий статус-индикатор.

   Структура Firestore:
     users/{uid}/days/{ГГГГ-ММ-ДД}  — документ на каждый день (объект дня целиком)
     users/{uid}/meta/settings      — настройки, кастом-задачи/привычки, БАДы, блокировки

      case "off":return "не настроено";
      case "config":return effectiveFirebaseConfig()?"войдите в аккаунт":"не настроено";
      case "connecting":return "подключение…";
      case "syncing":return "синхронизация…";
      case "offline":return "офлайн — правки сохранятся и уйдут в облако позже";
      case "error":return "ошибка: "+(S.lastErr||"?");
      case "synced":return "синхронизировано"+(S.lastSync?" · "+new Date(S.lastSync).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"")+(S.user&&S.user.email?" · "+S.user.email:"");
      default:return "";
    }
  }
  function dotColor(){return {off:"",config:"#6B6B75",connecting:"#FBBF24",syncing:"#818CF8",synced:"#4ADE80",offline:"#FB923C",error:"#F87171"}[S.state]||"";}
  function paintDot(){
    try{
      const el=document.getElementById("cloud-dot");if(!el)return;
      const c=dotColor();
      if(!c||S.state==="off"){el.style.display="none";return;}
      el.style.display="block";el.style.background=c;
      el.style.boxShadow=(S.state==="syncing"||S.state==="synced")?("0 0 6px "+c):"none";
      el.title="Облако: "+statusText();
      el.className="cloud-dot"+(S.state==="syncing"?" cloud-pulse":"");
    }catch(e){}
  }
  // Локальная запись без цикла обратной отправки (используем при приёме удалённых изменений).
  function writeLocal(){try{const r=safeWrite(KEY,days);if(r.ok)lastWritten=JSON.stringify(days);}catch(e){}}
  // Настройки: whole-object LWW по metaUpdated (меняются редко — построчное слияние не нужно).
  function applyCloudMeta(rm){
    if(!rm||typeof rm!=="object")return false;
    const rt=Number(rm.metaUpdated)||0,lt=Number(meta.metaUpdated)||0;
    if(rt<=lt)return false;
    for(const f of ["customTasks","customItems","userSups","supPeriods","blockers","blockerLog","checkinDay","checkinEve","lifeTarget"]){
      if(rm[f]!==undefined)meta[f]=rm[f];
    }
    meta.metaUpdated=rt;saveMeta({noStamp:true});applyCustomItems();return true;
  }

  async function ensureInit(){
    if(S.ready)return true;
    if(S.initing)return false;
    if(!effectiveFirebaseConfig()){setState("off");return false;}
    S.initing=true;setState("connecting");
    try{
      const [appM,authM,fsM]=await Promise.all([
        import(FB_SDK+"firebase-app.js"),
        import(FB_SDK+"firebase-auth.js"),
        import(FB_SDK+"firebase-firestore.js")
      ]);
      S.api={...appM,...authM,...fsM};
      // Повторная инициализация (смена проекта): убираем прежнее приложение, иначе initializeApp бросит.
      try{if(appM.getApps&&appM.getApps().length){await appM.deleteApp(appM.getApp());}}catch(e){}
      S.app=appM.initializeApp(effectiveFirebaseConfig());
      S.auth=authM.getAuth(S.app);
      try{await authM.setPersistence(S.auth,authM.browserLocalPersistence);}catch(e){}
      // Локальный кэш Firestore — как дополнительный офлайн-контур поверх нашего LocalStorage.
      try{S.db=fsM.initializeFirestore(S.app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})});}
      catch(e){S.db=fsM.getFirestore(S.app);}
      S.ready=true;
      authM.onAuthStateChanged(S.auth,u=>{onAuth(u);});
      return true;
    }catch(e){
      logError("cloud-init",e);setState("error",(e&&e.message)||e);S.initing=false;return false;
    }finally{S.initing=false;}
  }

  function onAuth(u){
    S.user=u||null;
    detachListeners();
    if(!u){setState("config");return;}
    setState("syncing");
    initialSync().catch(e=>{logError("cloud-initsync",e);setState("error",(e&&e.message)||e);});
  }

  function userPath(sub){return "users/"+S.user.uid+"/"+sub;}
  function daysCol(){const {collection}=S.api;return collection(S.db,userPath("days"));}
  function dayRef(k){const {doc}=S.api;return doc(S.db,userPath("days")+"/"+k);}
  function metaRef(){const {doc}=S.api;return doc(S.db,userPath("meta")+"/settings");}

  async function initialSync(){
    if(!S.ready||!S.user)return;
    const {getDocs,getDoc,writeBatch}=S.api;
    // 1) Тянем всё из облака и сливаем в локальные данные (LWW по единицам).
    const remote={};
    try{
      const snap=await getDocs(daysCol());
      snap.forEach(d=>{const k=d.id;if(/^\d{4}-\d{2}-\d{2}$/.test(k))remote[k]=d.data();});
    }catch(e){if(!online()){setState("offline");}else{logError("cloud-pull",e);}}
    S.applying=true;let localChanged=false;
    for(const k in remote){
      const merged=days[k]?mergeDayDeep(days[k],repairDay(remote[k])):repairDay(remote[k]);
      if(JSON.stringify(merged)!==JSON.stringify(days[k])){days[k]=merged;localChanged=true;}
    }
    if(localChanged)writeLocal();
    S.applying=false;
    // 2) Пушим в облако локальные дни, которых там нет или которые после слияния изменились.
    try{
      let batch=writeBatch(S.db),n=0,total=0;
      for(const k in days){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
        const rjson=remote[k]?JSON.stringify(remote[k]):null;
        if(rjson===JSON.stringify(days[k]))continue; // уже совпадает — не трогаем
        batch.set(dayRef(k),clean(days[k]));n++;total++;
        if(n>=400){await batch.commit();batch=writeBatch(S.db);n=0;}
      }
      if(n>0)await batch.commit();
    }catch(e){logError("cloud-seed",e);}
    // 3) Настройки: LWW по metaUpdated в обе стороны.
    try{
      const md=await getDoc(metaRef());
      const changed=md.exists()?applyCloudMeta(md.data()):false;
      if(!md.exists()||(Number(meta.metaUpdated)||0)>=(Number((md.data()||{}).metaUpdated)||0))await pushMetaNow();
      if(changed&&!_typing()){try{render();}catch(e){}}
    }catch(e){logError("cloud-meta",e);}
    S.seeded=true;
    attachListeners();
    if(localChanged&&!_typing()){try{render();}catch(e){}}
    setState(online()?"synced":"offline");S.lastSync=Date.now();paintDot();
  }

  function attachListeners(){
    if(!S.ready||!S.user)return;
    const {onSnapshot}=S.api;
    detachListeners();
    try{
      // Живой приём чужих правок дней. Свои оптимистичные записи (hasPendingWrites) пропускаем.
      S.unsub=onSnapshot(daysCol(),{includeMetadataChanges:false},snap=>{
        try{
          let changed=false;S.applying=true;
          snap.docChanges().forEach(ch=>{
            if(ch.doc.metadata.hasPendingWrites)return; // эхо собственной записи
            const k=ch.doc.id;if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
            if(ch.type==="removed")return; // мы никогда не удаляем дни
            const remote=ch.doc.data();
            const merged=days[k]?mergeDayDeep(days[k],repairDay(remote)):repairDay(remote);
            if(JSON.stringify(merged)!==JSON.stringify(days[k])){days[k]=merged;changed=true;}
          });
          S.applying=false;
          if(changed){writeLocal();S.lastSync=Date.now();if(!settingsOpen&&!modalOpen&&!_typing()){try{render();}catch(e){}}}
          if(S.state!=="syncing")setState(online()?"synced":"offline");
        }catch(e){S.applying=false;logError("cloud-snap",e);}
      },err=>{logError("cloud-snap-err",err);setState(online()?"error":"offline",err&&err.message);});
      S.unsubMeta=onSnapshot(metaRef(),{includeMetadataChanges:false},d=>{
        try{if(d.metadata.hasPendingWrites)return;if(!d.exists())return;if(applyCloudMeta(d.data())&&!settingsOpen&&!_typing()){try{render();}catch(e){}}}catch(e){logError("cloud-metasnap",e);}
      },err=>{logError("cloud-metasnap-err",err);});
    }catch(e){logError("cloud-attach",e);}
  }
  function detachListeners(){try{if(S.unsub){S.unsub();S.unsub=null;}if(S.unsubMeta){S.unsubMeta();S.unsubMeta=null;}}catch(e){}}

  async function flushDays(){
    if(!S.ready||!S.user||!S.seeded)return;
    if(!S.dirtyDays.size)return;
    if(!online()){setState("offline");return;}
    const {writeBatch}=S.api;
    const keys=[...S.dirtyDays];S.dirtyDays.clear();
    setState("syncing");
    try{
      let batch=writeBatch(S.db),n=0;
      for(const k of keys){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!days[k])continue;
        batch.set(dayRef(k),clean(days[k]));n++;
        if(n>=400){await batch.commit();batch=writeBatch(S.db);n=0;}
      }
      if(n>0)await batch.commit();
      S.lastSync=Date.now();setState("synced");
    }catch(e){keys.forEach(k=>S.dirtyDays.add(k));logError("cloud-push",e);setState(online()?"error":"offline",e&&e.message);}
  }
  async function pushMetaNow(){
    if(!S.ready||!S.user)return;
    const {setDoc}=S.api;
    try{await setDoc(metaRef(),clean(backupMeta()));S.metaDirty=false;}
    catch(e){logError("cloud-pushmeta",e);}
  }

  // ——— публичный интерфейс ———
  return {
    // очередь фоновой отправки изменённого дня (вызывается из save())
    queueDay(k){if(S.applying)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;S.dirtyDays.add(k);if(!S.ready||!S.user)return;clearTimeout(S.pushT);S.pushT=setTimeout(()=>flushDays().catch(()=>{}),2500);},
    queueMeta(){if(S.applying)return;S.metaDirty=true;if(!S.ready||!S.user)return;clearTimeout(S.metaT);S.metaT=setTimeout(()=>pushMetaNow().catch(()=>{}),2500);},
    flushNow(){try{flushDays().catch(()=>{});if(S.metaDirty)pushMetaNow().catch(()=>{});}catch(e){}},
    isConfigured(){return !!effectiveFirebaseConfig();},
    usingDefault(){return !meta.firebaseConfig;},
    isSignedIn(){return !!S.user;},
    email(){return S.user&&S.user.email||"";},
    state(){return S.state;},
    statusText,paintDot,
    async boot(){if(effectiveFirebaseConfig()){await ensureInit();}else{setState("off");}},
    // сохранить вставленный конфиг и переинициализировать
    async configure(text){
      let cfg;
      try{cfg=typeof text==="string"?parseFirebaseConfig(text):text;}
      catch(e){toast("Конфиг не распознан");return;}
      if(!cfg||!cfg.apiKey||!cfg.projectId){toast("В конфиге нет apiKey/projectId");return;}
      meta.firebaseConfig=cfg;saveMeta();
      // Полная переинициализация (простой путь: перезагрузка модульного состояния через reload).
      S.ready=false;S.initing=false;S.app=null;S.auth=null;S.db=null;
      toast("Конфиг сохранён");
      const ok=await ensureInit();
      if(ok&&!_typing()){try{render();}catch(e){}}
    },
    async signInGoogle(){
      if(!await ensureInit())return;
      const {GoogleAuthProvider,signInWithPopup}=S.api;
      try{await signInWithPopup(S.auth,new GoogleAuthProvider());}
      catch(e){logError("cloud-google",e);toast("Вход не удался: "+((e&&e.code)||""));}
    },
    async signInEmail(email,pass){
      if(!await ensureInit())return;
      const {signInWithEmailAndPassword,createUserWithEmailAndPassword}=S.api;
      email=(email||"").trim();pass=(pass||"");
      if(!email||pass.length<6){toast("Нужны e-mail и пароль (≥6 символов)");return;}
      try{await signInWithEmailAndPassword(S.auth,email,pass);}
      catch(e){
        if(e&&(e.code==="auth/user-not-found"||e.code==="auth/invalid-credential")){
          try{await createUserWithEmailAndPassword(S.auth,email,pass);toast("Аккаунт создан ✓");return;}
          catch(e2){logError("cloud-email-signup",e2);toast("Не вышло: "+((e2&&e2.code)||""));}
        }else{logError("cloud-email",e);toast("Вход не удался: "+((e&&e.code)||""));}
      }
    },
    async signOut(){
      try{const {signOut}=S.api||{};detachListeners();if(S.auth&&signOut)await signOut(S.auth);}catch(e){logError("cloud-signout",e);}
      S.user=null;S.seeded=false;setState("config");if(!_typing()){try{render();}catch(e){}}
    }
  };
})();
// Разбор вставленного пользователем Firebase-конфига: JSON, или JS-объект вида {apiKey:"…"},
// или сниппет "const firebaseConfig = {…};" со страницы Firebase Console.
function parseFirebaseConfig(text){
  text=String(text||"").trim();if(!text)return null;
  try{return JSON.parse(text);}catch(e){}
  const m=text.match(/\{[\s\S]*\}/);if(!m)return null;
  const body=m[0]
    .replace(/([,{]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":') // ключи без кавычек → в кавычки
    .replace(/'/g,'"')                                       // одинарные → двойные
    .replace(/,\s*([}\]])/g,'$1');                           // висячие запятые
  return JSON.parse(body);
}

let _rz;window.addEventListener("resize",()=>{if(meta.view!=="auto")return;clearTimeout(_rz);_rz=setTimeout(render,150);});
// Досинхронизация при сворачивании/закрытии вкладки — чтобы облако получило свежие правки.
document.addEventListener("visibilitychange",()=>{try{if(document.visibilityState==="hidden"){if(cloud)cloud.flushNow();}else{checkForUpdate();}}catch(e){}});
window.addEventListener("online",()=>{try{if(cloud){cloud.paintDot();cloud.flushNow();}checkForUpdate();}catch(e){}});
window.addEventListener("offline",()=>{try{if(cloud)cloud.paintDot();}catch(e){}});

/* === Авто-проверка версии ===
   Тихо запрашиваем свою же страницу с хостинга (обходя кэш) и сравниваем VERSION. Если на
   сервере новее — показываем ненавязчивую плашку «🔄 Обновить». Так пользователь не залипает
   на старой версии из кэша браузера. На file:// или без сети — просто молча ничего не делаем. */
let _lastVerCheck=0,_updShown=false;
async function checkForUpdate(){
  if(_updShown)return;
  const now=Date.now();
  if(now-_lastVerCheck<45000)return;            // не чаще раза в ~45 секунд
  _lastVerCheck=now;
  if(location.protocol==="file:")return;
  try{
    const base=location.href.split("#")[0].split("?")[0];
    const res=await fetch(base+"?vc="+now,{cache:"no-store"});
    if(!res||!res.ok)return;
    const txt=await res.text();
    const m=txt.match(/const VERSION="([^"]+)"/);
    if(m&&m[1]&&m[1]!==VERSION){_updShown=true;showUpdateBanner(m[1]);}
  }catch(e){}
}
function showUpdateBanner(v){
  try{
    if(document.getElementById("upd-bar"))return;
    const bar=document.createElement("div");bar.id="upd-bar";bar.className="upd-bar";
    const txt=document.createElement("span");txt.textContent="🔄 Новая версия "+String(v).replace(/[^0-9.]/g,"");
    const btn=document.createElement("button");btn.className="upd-go";btn.textContent="Обновить";
    btn.onclick=(e)=>{e.stopPropagation();doUpdateNow(v);};
    const x=document.createElement("button");x.className="upd-x";x.textContent="✕";
    x.onclick=(e)=>{e.stopPropagation();bar.remove();};
    bar.appendChild(txt);bar.appendChild(btn);bar.appendChild(x);
    document.body.appendChild(bar);vib(10);
  }catch(e){logError("upd-banner",e);}
}
// Жёсткая перезагрузка мимо кэша: уникальный параметр гарантирует свежую загрузку.
function doUpdateNow(v){
  try{
    const base=location.href.split("#")[0].split("?")[0];
    window.location.href=base+"?v="+encodeURIComponent(v||VERSION)+"_"+Date.now();
  }catch(e){try{location.reload();}catch(_){}}
}
function forceReload(){doUpdateNow("r");}
// После обновления (в адресе есть ?v=…) — показываем подтверждение и чистим адрес.
try{
  if(/[?&]v=/.test(location.search)){
    setTimeout(()=>{try{toast("✓ Обновлено · v"+VERSION);}catch(e){}},500);
    try{history.replaceState(null,"",location.pathname);}catch(e){}
  }
}catch(e){}
setTimeout(()=>{checkForUpdate();},30000);
setInterval(()=>{if(document.visibilityState==="visible")checkForUpdate();},15*60*1000);
window.addEventListener("error",ev=>{try{logError("js",(ev&&ev.message)||"?",(ev&&ev.filename?"":"")+"стр."+((ev&&ev.lineno)||"?"));}catch(e){}});
window.addEventListener("unhandledrejection",ev=>{try{logError("promise",String((ev&&ev.reason)||"?"));}catch(e){}});
const _origRender=render;
let _crashed=false,_pendingRender=false;
function _typing(){try{const a=document.activeElement;return !!a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");}catch(e){return false;}}
document.addEventListener("focusout",()=>{setTimeout(()=>{if(_pendingRender&&!_typing()){_pendingRender=false;render();}},60);},true);
render=function(force){
  if(_crashed)return;
  if(!force&&_typing()){_pendingRender=true;return;}
  _pendingRender=false;
  try{_origRender();}
  catch(err){
    _crashed=true;
    try{logError("render",err);}catch(e){}
    let raw="";try{raw=localStorage.getItem(KEY)||"";}catch(e){}
    const app=document.getElementById("app");
    if(app){
      app.innerHTML='<div style="padding:22px;color:#F5F5F7;font-family:system-ui,sans-serif;line-height:1.6">'
       +'<div style="font-size:19px;font-weight:800;color:#F87171;margin-bottom:10px">Экран не отрисовался</div>'
       +'<div style="font-size:13.5px;color:#D4D4D8;margin-bottom:6px">Данные целы. Скопируй их.</div>'
       +'<button id="rescue" style="width:100%;padding:13px;border-radius:12px;border:1px solid #6366F1;background:rgba(129,140,248,.12);color:#818CF8;font-size:15px;font-weight:700;margin-bottom:12px">Скопировать данные</button>'
       +'<textarea id="rescue-ta" readonly style="width:100%;height:170px;background:#101017;border:1px solid #1B1B26;border-radius:12px;color:#A1A1AA;font-size:11px;padding:10px">'+raw.replace(/</g,"&lt;")+'</textarea></div>';
      const btn=document.getElementById("rescue");
      if(btn)btn.onclick=function(){
        const ta=document.getElementById("rescue-ta");
        try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);document.execCommand("copy");btn.textContent="Скопировано ✓";}
        catch(e){btn.textContent="Выдели текст ниже и скопируй вручную";}
      };
    }
  }
};

applyCustomItems();
render();
// Тихо поднимаем облако после первой отрисовки — оно не должно задерживать показ экрана.
try{cloud.boot();}catch(e){logError("cloud-boot",e);}
// Раз в минуту тихо перерисовываем сегодняшний день — чтобы ритуалы сами появились/исчезли
// на границе своего окна (06/13, 19/23), без единого нажатия. При наборе текста render пропускается.
// Тихое авто-обновление ритуалов: перерисовываем НЕ каждую минуту, а только когда окно
// утра/вечера реально переключилось (≈4 раза в сутки). И не трогаем экран во время ввода,
// открытых настроек/модалки или сразу после касания — чтобы не мигнуть и не проглотить клик.
function _ritualKey(){if(sel!==todayKey())return "past";return (ritualVisible("morning")?1:0)+"|"+(ritualVisible("evening")?1:0);}
let _lastRitualKey=_ritualKey();
setInterval(()=>{
  try{
    if(sel!==todayKey()||settingsOpen||modalOpen||_typing())return;
    const k=_ritualKey();
    if(k===_lastRitualKey)return;
    if(_lastTap&&Date.now()-_lastTap.t<2000)return;
    _lastRitualKey=k;render();
  }catch(e){}
},20000);
</script>
