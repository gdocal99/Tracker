<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BLOCK 3 — Трекер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0E120F;color:#E8ECE6;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:440px;margin:0 auto;padding:18px 16px 70px}
button{cursor:pointer;font-family:inherit;transition:transform .09s ease}
.row:active,.prayer-btn:active,.cat-header:active,.mark-btn:active,.wbtn:active,.task-check:active,.q-btn:active,.state-btn:active,.backup-btn:active,.export-btn:active,.nav-btn:active,.task-add:active,.vt-btn:active,.task-del:active{transform:scale(.96)}
.prayer-btn.on{box-shadow:0 0 10px rgba(65,192,126,.22)}
@keyframes crownPulse{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}50%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42),0 0 9px rgba(61,220,132,.6)}}
.hist-cell.crown-cell{animation:crownPulse 2.4s ease-in-out infinite}
input,textarea{font-family:inherit;color:#E8ECE6;background:#19211A;border:1px solid #283029;border-radius:10px;padding:9px 10px;font-size:14px;outline:none;width:100%}
textarea{resize:none}
input[type=range]{background:none;accent-color:#41C07E;width:100%;height:28px;padding:0}
.section-label{font-size:11px;letter-spacing:1.5px;color:#5C655C;text-transform:uppercase;margin:20px 0 9px 2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:12px;background:#161D17;border:1px solid #283029;margin-top:7px;width:100%;text-align:left}
.row-label{font-size:14.5px;color:#8B968C;transition:color .15s}
.row-label.on{color:#E8ECE6}
.check-box{width:25px;height:25px;border-radius:8px;border:1.5px solid #3A453E;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.check-box svg{display:none}.check-box.on svg{display:block}
.prayer-btn{flex:1;padding:11px 2px;border-radius:12px;border:1px solid #283029;background:#161D17;color:#8B968C;font-size:12.5px;font-weight:600;transition:all .15s}
.prayer-btn.on{border-color:#41C07E;background:rgba(65,192,126,.14);color:#41C07E}
.prayers-row{display:flex;gap:6px;margin-top:7px}
.step-btn{width:34px;height:34px;border-radius:10px;border:1px solid #283029;background:#19211A;color:#E8ECE6;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.water-count{font-size:15px;font-weight:700;min-width:118px;text-align:center}
.wbtn{flex:1;padding:9px 0;border-radius:10px;border:1px solid #283029;background:#19211A;color:#8B968C;font-size:13px;font-weight:600}
.tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag-fact{background:#222C26;color:#7E8A80}
.tag-sched{background:rgba(203,164,92,.14);color:#CBA45C}
.cat-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 13px;border-radius:12px;background:#12180F;border:1px solid #232B24;margin-top:14px}
.cat-name{font-size:15px;font-weight:700;color:#E8ECE6}
.cat-count{font-size:12.5px;color:#79A98D;font-weight:600}
.tchip{margin-left:6px;color:#5C655C;font-weight:700;padding:1px 5px;border-radius:6px;border:1px solid #283029}
.tchip.lag{color:#CBA45C;border-color:#5a4630}
.wlog{display:flex;flex-wrap:wrap;gap:5px}
.wlog-e{font-size:11.5px;color:#8B968C;background:#161D17;border:1px solid #283029;border-radius:7px;padding:3px 7px}
.wlog-e b{color:#41C07E;font-family:ui-monospace,Menlo,monospace}
.mrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid #1c241d}
.msel{flex:0 0 92px;background:#161D17;border:1px solid #283029;border-radius:9px;color:#E8ECE6;font-size:12.5px;padding:8px 6px}
.mval{flex:1;min-width:0}
.munit{flex:0 0 auto;font-size:11px;color:#5C655C;min-width:32px}
.mtime{flex:0 0 92px}
.mlog{margin-top:8px;border-top:1px solid #232B24;padding-top:6px}
.mlog-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px}
.mlog-v{flex:1;color:#a9b3a4}
.mlog-v b{color:#E8ECE6}
.mlog-x{flex:0 0 30px;border-radius:8px;border:1px solid #283029;background:#161D17;color:#5C655C;font-size:12px;padding:5px 0}
.hud{border-bottom:1px solid #1c241d;padding:3px 2px;margin:0 0 6px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-day{font-size:13.5px;font-weight:700;color:#E8ECE6}
.hud-bal{font-size:19px;font-weight:800;color:#41C07E;font-family:ui-monospace,Menlo,monospace}
.hud-unit{font-size:11px;color:#5C655C;margin-left:1px}
.hud-earn{font-size:11.5px;color:#CBA45C;margin-left:6px;font-weight:700}
.hud-sub{font-size:11.5px;color:#8B968C;margin-top:2px}
.hud-life{color:#CBA45C;font-family:ui-monospace,Menlo,monospace}
.gear{position:absolute;top:10px;right:12px;z-index:50;width:34px;height:34px;border-radius:10px;border:1px solid #283029;background:#161D17;color:#8B968C;font-size:15px}
.gear-bad{border-color:#E0795B;color:#E0795B}
.gear-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#E0795B}
.log-card{background:#12180F;border:1px solid #232B24;border-radius:14px;margin:10px 0 4px;overflow:hidden}
.log-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:none;border:none;color:#E8ECE6;font-size:13.5px;font-weight:700}
.log-list{padding:0 13px 10px;max-height:300px;overflow-y:auto}
.log-row{display:flex;gap:10px;padding:5px 0;border-top:1px solid #1c241d;font-size:12.5px}
.log-t{flex:0 0 40px;color:#41C07E;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.log-e{color:#a9b3a4;line-height:1.45}
.cat-body{padding-top:1px}
.sub-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#79A98D;margin:12px 0 4px 4px;font-weight:700}
.sub-label:first-child{margin-top:6px}
.muted-note{font-size:13px;color:#5C655C;padding:10px 4px}
.sched-cap{font-size:12px;color:#7E8A80;padding:10px 4px 2px;line-height:1.5}
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.toggle-track{width:46px;height:27px;border-radius:14px;background:#222C26;position:relative;transition:.15s;flex-shrink:0}
.toggle-track.on{background:rgba(65,192,126,.3)}
.toggle-track.danger.on{background:rgba(224,121,91,.3)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:11px;background:#5C655C;transition:.15s}
.toggle-track.on .toggle-thumb{left:22px;background:#41C07E}
.toggle-track.danger.on .toggle-thumb{left:22px;background:#E0795B}
.state-btn{padding:7px 12px;border-radius:10px;font-size:13px;border:1px solid #283029;background:#19211A;color:#8B968C}
.state-btn.on{border-color:#41C07E;background:rgba(65,192,126,.12);color:#41C07E}
.expand-btn{width:100%;margin-top:14px;padding:13px 15px;border-radius:13px;background:#161D17;border:1px solid #283029;color:#8B968C;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.details-inner{background:#161D17;border:1px solid #283029;border-radius:15px;padding:15px;margin-top:8px;display:flex;flex-direction:column;gap:14px}
.slip-indent{padding-left:10px;border-left:2px solid #283029;display:flex;flex-direction:column;gap:10px}
.field-label{font-size:12px;color:#8B968C;margin-bottom:6px}
.field-row{display:flex;gap:10px}
.field-item{flex:1;min-width:0}
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-header{display:flex;justify-content:space-between}
.slider-val{font-size:14.5px;font-weight:700;color:#41C07E}
.slider-val.muted{color:#5C655C;font-weight:600;font-size:12px}
.slider-row.unset input[type=range]{opacity:.4}
.states-row{display:flex;gap:6px;flex-wrap:wrap}
.export-btn{width:100%;margin-top:14px;padding:13px;border-radius:13px;background:rgba(65,192,126,.10);border:1px solid #2C6B49;color:#41C07E;font-size:15px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px}
.backup-row{display:flex;gap:10px;margin-top:10px}
.backup-btn{flex:1;padding:11px;border-radius:12px;background:#161D17;border:1px solid #283029;color:#8B968C;font-size:13px;font-weight:600}
.header-card{border-radius:20px;border:1px solid #283029;padding:16px;transition:background .5s}
.topbar{position:sticky;top:0;z-index:40;background:#0E120F;padding:7px 0 8px;margin-bottom:10px;border-bottom:1px solid #1A221B}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 40px 0 2px}
.db-ring{position:relative;width:40px;height:40px;flex-shrink:0}
.db-ring svg{position:absolute;inset:0}
.db-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.db-bal{font-size:12px;font-weight:700;color:#CBA45C;flex-shrink:0;text-align:right;min-width:44px}
.dstrip{display:flex;gap:3px;padding:7px 2px 0}
.dcell{flex:1;height:20px;border-radius:5px;border:1px solid #283029;background:#161D17;cursor:pointer;font-size:9px;line-height:18px;text-align:center;padding:0}
.dcell.sel{border:1.5px solid #CBA45C}
.datebar-c{display:flex;align-items:baseline;gap:8px}
.datebar-dow{font-size:12px;color:#8B968C;text-transform:uppercase;letter-spacing:.5px}
.datebar-txt{font-size:18px;font-weight:700;color:#E8ECE6}
.q-btn.active{border-color:#79A98D;color:#cfe3d6;background:rgba(121,169,141,.14)}
.nav-row{display:flex;align-items:center;justify-content:space-between}
.nav-btn{width:38px;height:38px;border-radius:11px;border:none;background:transparent;color:#8B968C;font-size:22px;display:flex;align-items:center;justify-content:center}
.nav-btn:disabled{opacity:.25}
.date-center{text-align:center}
.date-dow{font-size:12px;letter-spacing:1.5px;color:#8B968C;text-transform:uppercase}
.date-txt{font-size:21px;font-weight:700}
.stats-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.ring-wrap{position:relative;width:112px;height:112px;flex-shrink:0}
.ring-wrap svg{position:absolute;top:0;left:0}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:25px;font-weight:800}
.ring-sub{font-size:10px;color:#8B968C}
.ring-cap{font-size:11.5px;color:#8B968C;margin-top:8px;text-align:center}
.ring-cap b{font-weight:700}
.streak-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.streak-txt{font-size:14.5px;font-weight:600}
.earn-label{font-size:13px;color:#8B968C}
.earn-val{font-size:19px;font-weight:700;color:#CBA45C}
.bal-txt{font-size:12px;color:#8B968C;margin-top:4px}
.bal-num{color:#E8ECE6;font-weight:600}
.hist-row{display:flex;gap:3px;flex-wrap:wrap}
.hist-cell{width:calc(12.5% - 3px);height:22px;border-radius:5px;border:1px solid #283029;background:#161D17;cursor:pointer}
.hist-cell.sel{border:1.5px solid #CBA45C}
.hist-month{font-size:12px;color:#8B968C;font-weight:600;margin:13px 0 6px 2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal-box{background:#161D17;width:100%;max-width:440px;border-radius:20px 20px 0 0;border:1px solid #283029;padding:18px;max-height:80vh;display:flex;flex-direction:column}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:16px;font-weight:700}
.modal-hint{font-size:12.5px;color:#8B968C;margin-bottom:10px}
.copy-btn{margin-top:12px;padding:13px;border-radius:13px;border:none;background:#41C07E;color:#0E120F;font-size:15px;font-weight:700;width:100%}
.mark-row{display:flex;gap:6px;margin-top:4px}
.mark-btn{flex:1;padding:10px 4px;border-radius:12px;border:1px solid #283029;background:#161D17;color:#8B968C;font-size:13px;font-weight:600}
.banner{border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.5;margin-bottom:6px}
.banner-empty{background:rgba(203,164,92,.10);border:1px solid #6b5a2c;color:#CBA45C}
.banner-warn{background:rgba(224,121,91,.12);border:1px solid #7a4a2a;color:#E0b09b}
.banner b{color:#fff}
.auto-save{text-align:center;font-size:11px;color:#5C655C;margin-top:22px;line-height:1.6}
.vt-row{display:flex;gap:5px;justify-content:flex-end;margin-bottom:10px}
.vt-btn{padding:6px 11px;border-radius:9px;border:1px solid #283029;background:#161D17;color:#8B968C;font-size:12px;font-weight:600}
.vt-btn.on{border-color:#41C07E;color:#41C07E;background:rgba(65,192,126,.12)}
.side-title{display:none}
#app.mode-mobile .grid{display:block}
#app.mode-desktop{max-width:1120px}
#app.mode-desktop .grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:22px;align-items:start;margin-top:16px}
#app.mode-desktop .cats-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;align-items:start}
#app.mode-desktop .cat-header{margin-top:0}
#app.mode-desktop .cat-block{min-width:0}
#app.mode-desktop .col-side{position:sticky;top:16px;display:flex;flex-direction:column}
#app.mode-desktop .col-side .side-title{display:block;font-size:13px;font-weight:700;color:#E8ECE6;margin:0 0 10px 2px;letter-spacing:.3px}
#app.mode-desktop .details-inner{margin-top:0}
#app.mode-desktop .export-btn,#app.mode-desktop .backup-row{margin-top:12px}
#app.mode-desktop .header-card{padding:20px 22px}
#app.mode-desktop .date-txt{font-size:24px}
#app.mode-desktop .col-full{margin-top:8px}
.pt-time{font-size:10px;font-weight:700;opacity:.9}
.pt-cfg{background:#12180F;border:1px solid #232B24;border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.pt-cfg u{cursor:pointer}
.pt-sel{width:100%;background:#19211A;color:#E8ECE6;border:1px solid #283029;border-radius:10px;padding:9px 10px;font-size:14px;height:38px}
.q-row{display:flex;gap:6px;margin:2px 0 4px 10px}
.q-btn{padding:6px 11px;border-radius:9px;border:1px solid #283029;background:#19211A;color:#8B968C;font-size:12px;font-weight:600}
.q-btn.good.on{border-color:#41C07E;color:#41C07E;background:rgba(65,192,126,.12)}
.q-btn.meh.on{border-color:#CBA45C;color:#CBA45C;background:rgba(203,164,92,.12)}
.tasks-card{background:#12180F;border:1px solid #232B24;border-radius:14px;padding:12px;margin-bottom:14px}
.tasks-card.locked{border-color:#7a4a2a}
.tasks-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tk-title{font-size:14px;font-weight:700;color:#E8ECE6}
.tk-right{display:flex;align-items:center;gap:10px}
.tk-badge{font-size:12px;font-weight:700}
.tk-badge.ok{color:#41C07E}
.tk-badge.no{color:#E0795B}
.tk-badge.muted{color:#5C655C;font-weight:600}
.task-add{width:30px;height:30px;border-radius:9px;border:1px solid #2f6b45;background:rgba(65,192,126,.12);color:#41C07E;font-size:20px;font-weight:700;line-height:1;padding:0}
.tasks-list{display:flex;flex-direction:column;gap:6px}
.task-row{display:flex;gap:6px}
.task-check{flex:1;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid #283029;background:#161D17;text-align:left}
.task-check.on{border-color:#2f6b45;background:rgba(65,192,126,.08)}
.task-box{width:20px;height:20px;border-radius:6px;border:1.5px solid #3a463c;display:flex;align-items:center;justify-content:center;color:#41C07E;font-size:13px;font-weight:700;flex:0 0 auto}
.task-check.on .task-box{border-color:#41C07E}
.task-lbl{font-size:14px;color:#E8ECE6}
.task-lbl.done{color:#5C655C;text-decoration:line-through}
.task-del{flex:0 0 40px;border-radius:12px;border:1px solid #283029;background:#161D17;color:#5C655C;font-size:13px}
.task-del.armed{background:#E0795B;border-color:#E0795B;color:#fff;font-size:11px;flex:0 0 60px}
.pt-cap{font-size:11px;color:#5C655C;padding:8px 2px 2px;line-height:1.4}
.prayer-btn.next{border-color:#E0955B;box-shadow:0 0 0 1.5px rgba(224,149,91,.5)}
.prayer-btn.next .pt-time{color:#E0955B}
.field-ta{width:100%;background:#19211A;color:#E8ECE6;border:1px solid #283029;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;min-height:110px;resize:vertical;line-height:1.5;box-sizing:border-box}
.meas-card{background:#12180F;border:1px solid #232B24;border-radius:14px;padding:12px;margin-top:14px}
.cf{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:cfFall linear forwards}
.cat-pulse{animation:catGlow .7s ease}
@keyframes catGlow{0%{box-shadow:0 0 0 0 rgba(65,192,126,.5)}70%{box-shadow:0 0 0 16px rgba(65,192,126,0)}100%{box-shadow:0 0 0 0 rgba(65,192,126,0)}}
@keyframes cfFall{to{transform:translateY(108vh) rotate(720deg)}}
.row{transition:background .3s ease,border-color .3s ease}
.row.on{background:rgba(65,192,126,.07);border-color:#2a4a35}
.task-check{transition:background .3s ease,border-color .3s ease}
@keyframes checkPop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.check-box.just{animation:checkPop .35s ease}
.task-box.just{animation:checkPop .35s ease}
@keyframes btnPop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.prayer-btn.just{animation:btnPop .3s ease}
.dcell,.hist-cell{transition:transform .15s ease}
.dcell:hover,.hist-cell:hover{transform:scale(1.12)}
.pt-pop{position:fixed;top:54px;right:18px;font-size:16px;font-weight:800;z-index:60;pointer-events:none;animation:ptPop .9s ease forwards}
@keyframes ptPop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-24px)}}
.db-ring{transition:filter .5s ease}
.db-ring.glow-lo{filter:drop-shadow(0 0 2px rgba(65,192,126,.3))}
.db-ring.glow-mid{filter:drop-shadow(0 0 5px rgba(65,192,126,.45))}
.db-ring.glow-hi{filter:drop-shadow(0 0 9px rgba(65,192,126,.6))}
@keyframes streakBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.streak-tag.tier1{display:inline-block;animation:streakBounce 1.5s ease-in-out infinite}
@keyframes streakFlash{0%,100%{text-shadow:none}50%{text-shadow:0 0 7px rgba(65,192,126,.65)}}
.streak-tag.tier2{display:inline-block;animation:streakFlash 2s ease-in-out infinite;color:#41C07E;font-weight:700}
.streak-tag.tier3{display:inline-block;color:#CBA45C;font-weight:700;text-shadow:0 0 9px rgba(203,164,92,.55)}
.toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.92);background:rgba(18,24,19,.97);border:1px solid #2f6b45;color:#41C07E;padding:14px 24px;border-radius:16px;font-size:15px;font-weight:700;z-index:70;pointer-events:none;animation:toastPop 1.8s ease forwards;white-space:nowrap}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
.life-card{background:#12180F;border:1px solid #232B24;border-radius:14px;padding:10px;margin-bottom:10px}

function repairDay(v){
  const b=blankDay();const out={...b};
  for(const f in b){
    const val=v[f];
    if(val===undefined||val===null)continue;
    if(Array.isArray(b[f]))out[f]=Array.isArray(val)?val:[];
    else if(b[f]&&typeof b[f]==="object")out[f]=(typeof val==="object"&&!Array.isArray(val))?val:{};
    else out[f]=val;
  }
  for(const f in v)if(!(f in b))out[f]=v[f];
  return out;
}
function validateDays(raw){
  const clean={},issues=[];
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return{clean:{},issues:["данные не являются объектом"]};
  for(const k in raw){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)){issues.push("выброшен неверный ключ дня: "+String(k).slice(0,20));continue;}
    const v=raw[k];
    if(!v||typeof v!=="object"||Array.isArray(v)){issues.push("день не объект: "+k);continue;}
    clean[k]=repairDay(v);
  }
  return{clean,issues};
}

function save(){

    logError("save-blocked","запись заблокирована: исходные данные повреждены, спасай их");
    return false;
  }
  try{
    const onDisk=localStorage.getItem(KEY);
    if(onDisk){
      const other=JSON.parse(onDisk);
      if(other&&typeof other==="object"&&!Array.isArray(other)){
        const mine=JSON.stringify(days);
        if(onDisk!==mine&&onDisk!==lastWritten){
          for(const k in other){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
            days[k]=days[k]?mergeDayDeep(days[k],repairDay(other[k])):repairDay(other[k]);
          }
          logError("merge-tabs","обнаружена запись из другой вкладки — данные слиты, ничего не потеряно");
        }

    }
  }catch(e){}
  const r=safeWrite(KEY,days);
  if(r.ok)lastWritten=JSON.stringify(days);
  if(r.ok&&Math.random()<0.05)autoPrune();

    saveState={ok:false,err:r.err,quota:!!r.quota};

  }

function fmtBytes(n){return n>1048576?(n/1048576).toFixed(2)+" МБ":(n/1024).toFixed(0)+" КБ";}
function selfTest(){
  const R=[];const t=(n,c)=>R.push({n,ok:!!c});
  try{
    t("хранилище доступно на запись",(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}})());
    t("последняя запись прошла",saveState.ok);
    t("данные не повреждены",!loadState.corrupt);
    t("данные читаются обратно",(()=>{try{const p=JSON.parse(localStorage.getItem(KEY)||"{}");return !!p&&typeof p==="object";}catch(e){return false;}})());
    t("ключи дней в верном формате",Object.keys(days).every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)));
    t("все дни — объекты",Object.values(days).every(d=>d&&typeof d==="object"&&!Array.isArray(d)));
    t("массивы дня целы (лог/вода/замеры)",Object.values(days).every(d=>["log","waterLog","supsLog","measLog","meals","spends"].every(f=>d[f]===undefined||Array.isArray(d[f]))));
    t("вода совпадает с суммой отметок",Object.values(days).every(d=>{const L=d.waterLog||[];if(!L.length)return true;const sum=L.reduce((a,x)=>a+(Number(x.ml)||0),0);return (Number(d.water)||0)>=sum-1;}));
    t("отчёт строится без ошибок",(()=>{try{return buildExport(days).length>0;}catch(e){return false;}})());
    t("резервные снимки существуют",listSnapshots().length>0);
    t("хранилище не переполнено",storageBytes()<4*1024*1024);
    t("ошибок не зафиксировано",errLog.length===0);
  }catch(e){R.push({n:"САМОПРОВЕРКА УПАЛА: "+e.message,ok:false});}
  return R;
}

  const snapRows=snaps.length?snaps.map(sn=>`<div class="mrow"><span class="log-t" style="flex:0 0 84px">${sn.date}</span><span class="mlog-v">${sn.n} дн.</span><button class="backup-btn" style="flex:0 0 auto;padding:5px 9px;font-size:11px" onclick="restoreSnapshot('${sn.key}')">${snapArm===sn.key?"точно?":"Восстановить"}</button></div>`).join(""):`<div class="muted-note" style="padding:4px 0">Снимков пока нет</div>`;

    ${errLog.length?`<button class="backup-btn" style="width:100%;margin-top:8px" onclick="clearErrors()">Очистить журнал ошибок</button>`:""}
  </div>`;
}

async function syncWithCloud() {
  if(!meta.gDriveEnabled || !gapiInited) return;
  syncStatus = "● Синхронизация..."; render(true);
  try {
    const resp = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name="block3_db.json"', { headers: { 'Authorization': `Bearer ${accessToken}` } });
    const data = await resp.json();
    let fileId = data.files && data.files[0] && data.files[0].id;
    
    if(!fileId) {
      const metaData = { name: 'block3_db.json', parents: ['appDataFolder'] };
      const boundary = '3_block_sync';
      const multipartBody = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metaData)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(days)}\r\n--${boundary}--`;

      syncStatus = "Облако создано";
    } else {
      const fileResp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
      const cloudDays = await fileResp.json();
      
      let merged = {};
      const allKeys = new Set([...Object.keys(days), ...Object.keys(cloudDays)]);
      for(const k of allKeys) {
        if(days[k] && cloudDays[k]) merged[k] = mergeDayDeep(days[k], cloudDays[k]);
        else merged[k] = days[k] || cloudDays[k];
      }
      days = merged; localStorage.setItem(KEY, JSON.stringify(days));
      
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify(days) });
      const now = new Date(); syncStatus = `Синхронизировано в ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    }
  } catch(e) { syncStatus = "Ошибка синхронизации"; logError("gdrive-sync", e); }
  render(true);
}

let _rz;window.addEventListener("resize",()=>{if(meta.view!=="auto")return;clearTimeout(_rz);_rz=setTimeout(render,150);});
window.addEventListener("error",ev=>{try{logError("js",(ev&&ev.message)||"?",(ev&&ev.filename?"":"")+"стр."+((ev&&ev.lineno)||"?"));}catch(e){}});
window.addEventListener("unhandledrejection",ev=>{try{logError("promise",String((ev&&ev.reason)||"?"));}catch(e){}});
const _origRender=render;
let _crashed=false,_pendingRender=false;
function _typing(){try{const a=document.activeElement;return !!a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");}catch(e){return false;}}
document.addEventListener("focusout",()=>{setTimeout(()=>{if(_pendingRender&&!_typing()){_pendingRender=false;render();}},60);},true);
render=function(force){
  if(_crashed)return;
  if(!force&&_typing()){_pendingRender=true;return;}
  _pendingRender=false;
  try{_origRender();}
  catch(err){
    _crashed=true;
    try{logError("render",err);}catch(e){}
    let raw="";try{raw=localStorage.getItem(KEY)||"";}catch(e){}
    const app=document.getElementById("app");
    if(app){
      app.innerHTML='<div style="padding:22px;color:#E8ECE6;font-family:system-ui,sans-serif;line-height:1.6">'
       +'<div style="font-size:19px;font-weight:800;color:#E0795B;margin-bottom:10px">Экран не отрисовался</div>'
       +'<div style="font-size:13.5px;color:#a9b3a4;margin-bottom:6px">Данные целы. Скопируй их.</div>'
       +'<button id="rescue" style="width:100%;padding:13px;border-radius:12px;border:1px solid #2f6b45;background:rgba(65,192,126,.12);color:#41C07E;font-size:15px;font-weight:700;margin-bottom:12px">Скопировать данные</button>'
       +'<textarea id="rescue-ta" readonly style="width:100%;height:170px;background:#12180F;border:1px solid #232B24;border-radius:12px;color:#8B968C;font-size:11px;padding:10px">'+raw.replace(/</g,"&lt;")+'</textarea></div>';
      const btn=document.getElementById("rescue");
      if(btn)btn.onclick=function(){
        const ta=document.getElementById("rescue-ta");
        try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);document.execCommand("copy");btn.textContent="Скопировано ✓";}
        catch(e){btn.textContent="Выдели текст ниже и скопируй вручную";}
      };
    }
  }
};

loadSyncScripts();
render();
</script>
