     строки и вкладок браузера. Это не «ещё одна копия» — данные те же самые (то же хранилище того
     же адреса), просто вход в них перестаёт идти через общий браузер. -->
<link rel="manifest" href="manifest.json">

<title>BLOCK 3 — Трекер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* ── Токены. Значения 1:1 совпадают с теми, что были захардкожены по файлу, поэтому появление
   этого блока само по себе ничего не меняет. Дальше на них переводятся только те правила,
   которые и так правятся — сплошная замена по файлу запрещена (риск незаметных регрессий). */
:root{
  /* Сообщает браузеру, что тема тёмная. Одной строкой чинит ВСЕ нативные элементы разом:
     полосы прокрутки (на Windows они были ярко-белыми на почти чёрном фоне), выпадающие
     календарь и часы у input[type=time]/date, автозаполнение. */
  color-scheme:dark;
  --bg:#060609; --surface-1:#101017; --surface-2:#16161C; --line:#1B1B26; --line-2:#3A3A45;
  --text:#F5F5F7; --text-2:#A1A1AA; --text-3:#8B8B95; --text-4:#6B6B75;
  --accent:#818CF8; --accent-soft:rgba(129,140,248,.14); --accent-line:#6366F1;
  --ok:#4ADE80; --warn:#FBBF24; --next:#FB923C; --bad:#F87171; --water:#38BDF8;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-0:8px; --r-1:10px; --r-2:12px; --r-3:16px; --r-4:20px;
  --tap:36px; --tap-lg:40px;
  --ic-sm:16px; --ic-md:20px; --ic-lg:26px;
  /* ТИПОГРАФИЧЕСКАЯ ШКАЛА. Раньше в файле было 24 разных кегля (9, 9.5, 10, 10.5, 11, 11.5, 12,
     12.5, 13, 13.5, 14, 14.5, 15, 16, 17, 18, 19, 20, 21, 22, 24, 25, 26, 28). Разнобой сам по
     себе шум: глаз не строит устойчивую модель «какой это уровень», и всё выглядит одинаково
     важным. Шесть ступеней с внятным шагом (~×1.15…1.26) дают иерархию без роста плотности —
     ступени подобраны так, чтобы почти все элементы сели на ближайшее значение и размер не
     подскочил. Роли ступеней:
       --fs-1 микроподписи, капс, единицы измерения
       --fs-2 вторичное: время, счётчики, метки чипов
       --fs-3 базовое: текст строк, названия дел
       --fs-4 заголовки блоков и дата
       --fs-5 крупные числа шапки
       --fs-6 герой экрана — ровно один элемент, процент дня в кольце
     Самый крупный элемент экрана — ответ на вопрос «как я иду сегодня», а не «какое сегодня
     число»: при СДВГ первым должно считываться состояние, а не контекст. */
  --fs-1:10px; --fs-2:11.5px; --fs-3:13px; --fs-4:16px; --fs-5:19px; --fs-6:24px;
  /* Ширина: лестница вместо жёстких 440/1080px. На ноутбуке приложение занимает экран, а не
     висит узкой полосой посередине. --cats-cols читается из JS (catsCols) — один источник правды. */
  --shell-max:480px; --pad-x:16px; --pad-y:18px; --pad-b:34px; --rail:0px; --cats-cols:1; --gap:12px;
}
@media (min-width:700px){ :root{--shell-max:660px;--pad-x:24px} }
@media (min-width:1000px){:root{--shell-max:1180px;--pad-x:28px;--rail:320px;--cats-cols:2;--pad-b:40px} }
@media (min-width:1440px){:root{--shell-max:1560px;--pad-x:32px;--rail:330px;--cats-cols:3} }
@media (min-width:1800px){:root{--shell-max:1760px;--pad-x:40px;--rail:340px} }
body{background:#060609;color:#F5F5F7;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
/* Явные тёмные полосы прокрутки — для браузеров, которые не подхватывают color-scheme. */
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#5A5A68;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
/* position:relative обязателен: .gear и .cloud-dot заданы absolute, и без позиционированного
   предка они цеплялись к углу СТРАНИЦЫ — на широком экране шестерёнка улетала от контента. */
#app{position:relative;width:100%;max-width:var(--shell-max);margin:0 auto;padding:12px var(--pad-x) var(--pad-b)}
/* Ручной переключатель вида перебивает лестницу. */
#app.force-mobile{--shell-max:480px;--rail:0px;--cats-cols:1;--pad-b:34px}
#app.force-desktop{--rail:330px;--cats-cols:3}
/* Каркас: слева липкая панель управления, справа блоки. На телефоне — обычный поток. */
.shell{display:block}
@media (min-width:1000px){
  #app:not(.force-mobile) .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:var(--sp-5);align-items:start}
  #app:not(.force-mobile) .rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  #app:not(.force-mobile) .rail .dash{margin:0}
}
.cats-grid{display:grid;grid-template-columns:repeat(var(--cats-cols),minmax(0,1fr));gap:var(--gap);align-items:start}
.cats-col{min-width:0}
.cats-col .cat-block{margin:0 0 var(--gap)}
button{cursor:pointer;font-family:inherit;transition:transform .09s ease}
.row:active,.prayer-btn:active,.cat-header:active,.mark-btn:active,.wbtn:active,.task-check:active,.q-btn:active,.state-btn:active,.backup-btn:active,.export-btn:active,.nav-btn:active,.task-add:active,.vt-btn:active,.task-del:active{transform:scale(.96)}
.prayer-btn.on{box-shadow:0 0 10px rgba(129,140,248,.22)}
@keyframes crownPulse{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}50%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42),0 0 9px rgba(165,180,252,.6)}}
.hist-cell.crown-cell{animation:crownPulse 2.4s ease-in-out infinite}
input,textarea{font-family:inherit;color:#F5F5F7;background:#101017;border:1px solid #1B1B26;border-radius:9px;padding:9px 10px;font-size:14px;outline:none;width:100%;min-height:38px}
textarea{resize:none}
/* Свой вид вместо системного. ВАЖНО: touch-action:pan-y обязателен — без него вертикальная
   прокрутка страницы воспринимается как перетаскивание и ползунок сам выставляет значение
   (эта ошибка уже была). Высота самого input оставлена 28px ради зоны касания, а видимый
   трек рисуется тоньше через ::-webkit-slider-runnable-track. */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;padding:0;margin:6px 0;
  background:transparent;outline:none;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.04)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;background:#818CF8;margin-top:-7px;
  box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 10px rgba(129,140,248,.35);
  transition:transform .15s ease,background .15s ease}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.18);background:#A5B4FC}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.04)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:none;border-radius:50%;background:#818CF8;
  box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 10px rgba(129,140,248,.35)}
.section-label{font-size:var(--fs-1);letter-spacing:1.3px;color:#6B6B75;text-transform:uppercase;margin:14px 0 6px 2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:10px;background:#16161C;border:1px solid transparent;margin-top:5px;width:100%;text-align:left}
/* Невыполненное — яркое, выполненное — приглушённое. Раньше было наоборот: сделанный пункт
   становился #F5F5F7, а несделанный оставался #A1A1AA, то есть глаз тянуло к тому, о чём уже
   можно забыть. При СДВГ это прямой вред. Тот же приём уже применён в задачах (.task-lbl.done).
   Зачёркивание сознательно НЕ добавляем: привычек в списке десятки, и перечёркнутые строки
   сами превращаются в шум (в задачах их 2–5, там уместно). */
.row-label{font-size:var(--fs-3);color:#F5F5F7;transition:color .15s}
/* --text-3, а не --text-4: приглушает втрое (16.6:1 → 5.3:1), но остаётся выше порога
   читаемости 4.5:1. С --text-4 было бы 3.4:1 — выполненное стало бы трудночитаемым,
   а его всё-таки нужно уметь перечитать. */
.row-label.on{color:var(--text-3)}
/* Рамка пустого чекбокса была #3A3A45 на фоне #16161C — контраст 1.63:1 при норме 3:1 для
   органов управления: кружок буквально сливался с карточкой. #6B6B75 даёт 3.48:1. */
/* Кружок «вдавлен» внутренней тенью — так он читается как элемент управления, а не как дырка
   в фоне. Размер сознательно оставлен прежним: интерфейс только что уплотняли. */
.check-box{width:21px;height:21px;border-radius:50%;border:1.5px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.25);box-shadow:inset 0 2px 4px rgba(0,0,0,.32);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:box-shadow .25s cubic-bezier(.4,0,.2,1),border-color .25s,background .25s}
.check-box svg{display:none}.check-box.on svg{display:block}
/* Галочка остаётся яркой — сатисфакция от выполнения никуда не девается. */
/* Выполнено — мягкое свечение вместо плоской заливки: микро-награда за действие. */
.check-box.on{border-color:#818CF8;background:rgba(129,140,248,.18);box-shadow:0 0 12px rgba(129,140,248,.28),inset 0 1px 2px rgba(255,255,255,.06)}
/* Подсветка «приглашения к нажатию» — ТОЛЬКО для мыши. На тач-экране :hover залипает после
   тапа, и элемент выглядит нажатым, хотя это не так. */
@media (hover:hover) and (pointer:fine){
  .row:hover .check-box,.task-check:hover .task-box{border-color:rgba(129,140,248,.45);background:rgba(129,140,248,.07)}
}
.prayer-btn{position:relative;overflow:hidden;flex:1;padding:11px 2px;min-height:42px;border-radius:12px;border:1px solid #1B1B26;background:#16161C;color:#A1A1AA;font-size:12.5px;font-weight:600;transition:all .15s}
.prayer-btn.on{border-color:#818CF8;background:rgba(129,140,248,.14);color:#818CF8}
.prayers-row{display:flex;gap:6px;margin-top:7px}
.step-btn{width:var(--tap);height:var(--tap);border-radius:10px;border:1px solid #1B1B26;background:#101017;color:#F5F5F7;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.water-count{font-size:15px;font-weight:700;min-width:118px;text-align:center}
.wbtn{flex:1;padding:10px 0;min-height:40px;border-radius:10px;border:1px solid #1B1B26;background:#101017;color:#A1A1AA;font-size:14px;font-weight:600}
.tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag-fact{background:#1B1B26;color:#A8A29E}
.tag-sched{background:rgba(203,164,92,.14);color:#FBBF24;border:1px solid rgba(251,191,36,.22);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.4px}
/* Каждая категория — чётко очерченный блок (карта: ясно, что к чему относится). */
.cat-block{border:1px solid #1B1B26;border-radius:var(--r-3);background:linear-gradient(180deg,#13131B,#0E0E15);
  overflow:hidden;margin-top:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.cat-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:none;border-radius:0;background:#101017;margin-top:0}
.cat-body{padding:2px 10px 10px}
.cat-name{font-size:var(--fs-4);font-weight:800;color:#F5F5F7;letter-spacing:.2px}
.blk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;flex:0 0 auto;box-shadow:0 0 6px -1px currentColor}
/* Плавное «выезжание» тела блока при раскрытии (аккордеон) — глаз успевает проследить. */
@keyframes accOpen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cat-body-anim{animation:accOpen .26s cubic-bezier(.2,.7,.3,1)}
/* Раньше счётчик был зелёным всегда — даже «0/14» светилось как достижение, то есть подавало
   ложный сигнал «всё хорошо». Теперь нейтральная плашка, а зелёным становится только при 100%. */
.cat-count{font-size:var(--fs-2);font-weight:600;color:var(--text-2);background:rgba(255,255,255,.06);padding:3px 7px;border-radius:8px}
.cat-count.done{background:rgba(74,222,128,.15);color:var(--ok)}
.tchip{margin-left:6px;color:#6B6B75;font-weight:700;padding:1px 5px;border-radius:6px;border:1px solid #1B1B26}
.tchip.lag{color:#FBBF24;border-color:#4A3821}
.wlog{display:flex;flex-wrap:wrap;gap:5px}
.wlog-e{font-size:11.5px;color:#A1A1AA;background:#16161C;border:1px solid #1B1B26;border-radius:7px;padding:3px 7px}
.wlog-e b{color:#818CF8;font-family:ui-monospace,Menlo,monospace}
/* flex-wrap: на узком телефоне строка замера/лога переносится (значение остаётся видимым сверху,
   время и «удалить» уходят на вторую строку), а не сплющивает поле ввода до невидимой полоски. */
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 0;border-top:1px solid #1B1B26}
.msel{flex:0 0 92px;background:#16161C;border:1px solid #1B1B26;border-radius:9px;color:#F5F5F7;font-size:12.5px;padding:8px 6px;min-height:var(--tap)}
/* Поле значения НИКОГДА не сжимается ниже читаемой ширины — иначе на телефоне не видно, что вводишь. */
.mval{flex:1 1 88px;min-width:88px}
.munit{flex:0 0 auto;font-size:11px;color:#6B6B75;min-width:32px}
.mtime{flex:0 0 92px}
.mlog{margin-top:8px;border-top:1px solid #1B1B26;padding-top:6px}
.mlog-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px}
.mlog-v{flex:1;color:#D4D4D8}
.mlog-v b{color:#F5F5F7}
.mlog-x{flex:0 0 40px;min-height:36px;border-radius:8px;border:1px solid #1B1B26;background:#16161C;color:#8B8B95;font-size:14px;padding:5px 0}
.hud{border-bottom:1px solid #1B1B26;padding:3px 2px;margin:0 0 6px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-day{font-size:13.5px;font-weight:700;color:#F5F5F7}
.hud-bal{font-size:19px;font-weight:800;color:#818CF8;font-family:ui-monospace,Menlo,monospace}
.hud-unit{font-size:11px;color:#6B6B75;margin-left:1px}
.hud-earn{font-size:11.5px;color:#FBBF24;margin-left:6px;font-weight:700}
.hud-sub{font-size:11.5px;color:#A1A1AA;margin-top:2px}
.hud-life{color:#FBBF24;font-family:ui-monospace,Menlo,monospace}
.gear{position:absolute;top:12px;right:14px;z-index:50;width:42px;height:42px;border-radius:12px;border:1px solid #1B1B26;background:#16161C;color:#A1A1AA;font-size:19px}

   экрана. Конструктор привычек — во всю ширину (он самый большой), остальные карточки —
   в 2 колонки. Экран настроек — отдельная ветка рендера без mode-desktop/mobile на #app,
   поэтому переключаем по ширине окна напрямую, а не по классу режима. */

.task-del.armed{background:#F87171;border-color:#F87171;color:#fff;font-size:11px;flex:0 0 60px;opacity:1}

.field-ta{width:100%;background:#101017;color:#F5F5F7;border:1px solid #1B1B26;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;min-height:110px;resize:vertical;line-height:1.5;box-sizing:border-box}
/* Свёртываемое поле дневника: закрыто по умолчанию, при открытии растёт по мере ввода (запас 5 строк). */
.ta-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:12px;background:#16161C;border:1px solid #1B1B26;color:#D4D4D8;font-size:13.5px;font-weight:600;text-align:left}

/* Подблок внутри большого блока: тонкая шапка-разделитель. */
.subblock{margin-top:12px}
.subblock:first-child{margin-top:2px}
.sb-head{font-size:12px;font-weight:700;letter-spacing:.4px;color:#86EFAC;padding:6px 2px 3px;border-top:1px solid #1B1B26;margin-top:6px;display:flex;align-items:center;gap:6px}
.subblock:first-child .sb-head{border-top:none;margin-top:0}
.meas-card{background:linear-gradient(180deg,#13131B,#0E0E15);border:1px solid transparent;border-radius:var(--r-3);
  padding:11px;margin-top:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.cf{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:cfFall linear forwards}
.cat-pulse{animation:catGlow .7s ease}
@keyframes catGlow{0%{box-shadow:0 0 0 0 rgba(129,140,248,.5)}70%{box-shadow:0 0 0 16px rgba(129,140,248,0)}100%{box-shadow:0 0 0 0 rgba(129,140,248,0)}}
@keyframes cfFall{to{transform:translateY(108vh) rotate(720deg)}}
/* === Отклик на действие: МЕДЛЕННЫЕ, плавные, приятные волны + мягкое свечение. Клипуются
   границами пункта (overflow:hidden по rect), НЕ перекрывают текст (лежат в fx-box поверх, но
   полупрозрачны и быстро гаснут). Награда — только за хорошее; за плохое — отдельный тихий отклик. === */
.fx-box{position:fixed;overflow:hidden;pointer-events:none;z-index:80;border-radius:12px}
.fx-wave{position:absolute;border-radius:50%;border:2px solid var(--c,#818CF8);transform:translate(-50%,-50%) scale(.18);opacity:0;animation:fxWave var(--d,1s) cubic-bezier(.22,.61,.36,1) forwards}
@keyframes fxWave{0%{transform:translate(-50%,-50%) scale(.18);opacity:0}20%{opacity:var(--o,.65)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* Мягкое свечение из точки касания — тёплый «выдох», не вспышка. */
.fx-glow{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),var(--c,#818CF8),transparent 68%);opacity:0;animation:fxGlow var(--d,1s) ease-out forwards}
@keyframes fxGlow{0%{opacity:0}28%{opacity:.22}100%{opacity:0}}
/* Отклик на «плохое» действие (срыв, провал, сладкое, игры) — тихий приглушённый рубиновый вдох. */
.fx-neg{position:absolute;inset:0;background:var(--c,#F87171);opacity:0;animation:fxNeg .55s ease-out forwards}
@keyframes fxNeg{0%{opacity:0}35%{opacity:.16}100%{opacity:0}}
/* РАЗНЫЕ отклики под разные категории — чтобы не однотипно. Все спокойные и клипуются пунктом. */
/* Цветение (намаз, общение): лепестки мягко распускаются из точки и тают. */
.fx-petal{position:absolute;width:8px;height:8px;border-radius:64% 0 64% 0;background:var(--c,#FBBF24);transform:translate(-50%,-50%) scale(0) rotate(var(--r,0deg));opacity:0;animation:fxPetal 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxPetal{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(var(--r,0deg))}30%{opacity:.9;transform:translate(calc(-50% + var(--dx,0px)*.5),calc(-50% + var(--dy,0px)*.5)) scale(1) rotate(var(--r,0deg))}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(.7) rotate(var(--r,0deg))}}
/* Рябь (вода): несколько тонких колец, помедленнее — «капля упала». */

    return false;
  }
}

// ВСЁ ВРЕМЯ В ПРИЛОЖЕНИИ — ПО КИЕВУ, а не по часам устройства.
// Причина: на ноутбуке иногда сбивается часовой пояс/время. Пользователь живёт в одном поясе
// (Киев, Europe/Kiev, зимой +2 / летом +3) и никуда не переезжает. Поэтому «сегодня», час и
// минута считаются по Киеву независимо от настроек устройства — день не «уедет» на соседний.
// Работает так: берём АБСОЛЮТНУЮ метку (Date.now(), это UTC-момент, он НЕ зависит от того, какой
// пояс выставлен в системе) и переводим её в киевские стенные часы. Если у ноутбука сбит именно
// часовой пояс — даты/времена всё равно верные. (Если сбита сама UTC-метка — это уже другой
// случай, тут поможет только интернет-время; сейчас закрываем самый частый сцен  — пояс.)
const APP_TZ="Europe/Kiev";
let _tzFmt=null;
function _tzFormatter(){
  if(_tzFmt!==null)return _tzFmt;

let lastWritten="";
let loadState={ok:true,corrupt:false,raw:"",restoredFrom:"",repaired:0,issues:[]};
function storageBytes(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=(k||"").length+((localStorage.getItem(k)||"").length);}}catch(e){}return n*2;}

// @@ХРАНЕНИЕ@@ — запись на диск, слияние, снимки
function safeWrite(key,obj){
  let json;
  try{json=JSON.stringify(obj);}catch(e){return{ok:false,err:"не сериализуется: "+e.message,quota:false};}
  try{
    localStorage.setItem(key,json);
    const back=localStorage.getItem(key);
    if(back!==json)return{ok:false,err:"запись не подтвердилась при перечитывании",quota:false};
    return{ok:true};
  }catch(e){
    const nm=String((e&&e.name)||"")+" "+String((e&&e.message)||"");
    const quota=/quota|exceed|full|storage/i.test(nm);
    return{ok:false,err:quota?"ХРАНИЛИЩЕ БРАУЗЕРА ПЕРЕПОЛНЕНО":String((e&&e.message)||e),quota};
  }
}

function snapKeys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(SNAP_PREFIX)===0)out.push(k);}}catch(e){}return out.sort();}
function pruneOldLogs(){
  const floor=addDays(todayKey(),-90);
  let freed=0;
  for(const k in days){
    if(k>=floor)continue;
    const d=days[k];if(!d)continue;
    let nd=d,touched=false;
    if(Array.isArray(d.log)&&d.log.length>4){
      freed+=d.log.length-4;
      nd={...nd,log:[{t:d.log[0].t,e:"(хронология свёрнута: было "+d.log.length+" отметок, "+d.log[0].t+"–"+d.log[d.log.length-1].t+")"}]};
      touched=true;
    }
    // Погода старого дня — самая объёмная часть записи (8 массивов по 6 точек), а в отчётах она уже
    // отражена. Для дней старше 90 дней выбрасываем её целиком: это основной источник роста хранилища.
    if(nd.weather){nd={...nd,weather:null};freed++;touched=true;}
    // Тумбстоуны удалённых строк старше 90 дней больше не нужны — все устройства давно синхронизированы.
    if(Array.isArray(nd.del)&&nd.del.length){nd={...nd,del:[]};touched=true;}
    if(touched)days[k]=nd;
  }
  return freed;
}
/* ═══ ТРИ КОНТУРА СОХРАННОСТИ ═══
   1) Живая синхронизация — день пишется в облако сразу. Защищает от потери телефона,
      но НЕ защищает от удаления: сотрёшь данные — сотрутся и там.
   2) Облачный автоархив (здесь) — раз в 10 дней полная копия журнала кладётся в ОТДЕЛЬНУЮ
      коллекцию, до которой стирание дней не дотягивается. Полный автомат, участия не требует.
   3) Файл на диск — раз в месяц напоминание с одной кнопкой. Единственное, что браузер не может
      сделать сам: скачивание файла требует касания человека.
   Документ Firestore ограничен ~1 МБ, поэтому журнал режется на части и собирается обратно. */
const ARCH_CHUNK=600000;      // символов в одной части
const ARCH_KEEP=4;            // сколько облачных архивов держим
const ARCH_EVERY=10*86400000; // раз в 10 дней
function archSplit(json){const out=[];for(let i=0;i<json.length;i+=ARCH_CHUNK)out.push(json.slice(i,i+ARCH_CHUNK));return out.length?out:[""];}
function archJoin(parts){return (parts||[]).slice().sort((a,b)=>a.i-b.i).map(x=>x.data||"").join("");}
// Слияние архива в текущие данные. Как и снимок, архив может только ДОБАВИТЬ: победитель в
// mergeDayDeep определяется метками полей, а у нынешних записей они свежее.
function mergeArchiveDays(D){
  let added=0,combined=0;
  for(const k in D){
    if(!isDayKey(k))continue;
    if(!days[k]||dayIsEmpty(days[k])){days[k]=repairDay(D[k],true);added++;}
    else{days[k]=mergeDayDeep(days[k],repairDay(D[k],true));combined++;}
  }
  return {added,combined};
}
function monthlyBackupDue(){
  const last=Number(meta.lastBackup)||0;
  if(!last)return Object.keys(days).filter(isDayKey).length>0;
  return (Date.now()-last)>=30*86400000;
}
function makeSnapshot(){
  const k=SNAP_PREFIX+todayKey();
  try{if(localStorage.getItem(k))return;}catch(e){return;}
  const r=safeWrite(k,{_schema:SCHEMA,_at:new Date().toISOString(),days});
  if(!r.ok){logError("snapshot",r.err);return;}
  const all=snapKeys();
  while(all.length>1){const old=all.shift();try{localStorage.removeItem(old);}catch(e){}}
}
function listSnapshots(){
  return snapKeys().map(k=>{
    try{const o=JSON.parse(localStorage.getItem(k));return{key:k,date:k.slice(SNAP_PREFIX.length),n:Object.keys(o.days||{}).length,days:o.days};}
    catch(e){return null;}
  }).filter(Boolean).reverse();
}
function restoreSnapshot(k){
  if(snapArm!==k){snapArm=k;vib(8);render();setTimeout(()=>{if(snapArm===k){snapArm="";render();}},4000);return;}
  snapArm="";
  try{
    const o=JSON.parse(localStorage.getItem(k));
    if(!o||!o.days)throw new Error("снимок пуст");
    const v=validateDays(o.days);
    // РАНЬШЕ здесь было days=v.clean — снимок ЗАМЕЩАЛ всё, и любая запись, сделанная после снимка,
    // исчезала. Два касания — и работа за сегодня пропала. Кнопка «восстановить» не имеет права
    // ничего терять: восстановление — это спасение данных, а не откат системы.
    // Теперь снимок ДОБАВЛЯЕТСЯ: недостающие дни и поля возвращаются, всё нынешнее остаётся
    // (в слиянии побеждает более поздняя метка, а она у текущих записей).
    const now=Object.keys(days).filter(isDayKey).length;
    const inSnap=Object.keys(v.clean).filter(isDayKey).length;
    if(!confirm("Восстановить из снимка?\n\nСейчас в дневнике: "+now+" дн.\nВ снимке: "+inSnap+" дн.\n\nСнимок будет ДОБАВЛЕН к нынешним данным: вернётся то, чего не хватает.\nНичего из сегодняшнего не пропадёт.")){render();return;}
    let added=0,combined=0;
    for(const dk in v.clean){
      if(!isDayKey(dk))continue;
      if(!days[dk]||dayIsEmpty(days[dk])){days[dk]=repairDay(v.clean[dk],true);added++;}
      else{days[dk]=mergeDayDeep(days[dk],repairDay(v.clean[dk],true));combined++;}
    }
    loadState={...loadState,ok:true,corrupt:false,raw:"",restoredFrom:k,ackCorrupt:true};
    save();vib(15);toast("Из снимка добавлено: "+added+" дн., дополнено: "+combined);render();

function weatherSummaryTxt(w){

  const rh=nums(w.rh),p=nums(w.p),ws=nums(w.ws),pr=nums(w.pr),cc=nums(w.cc);

  if(rh.length)parts.push("💧 "+(Math.min(...rh)===Math.max(...rh)?Math.max(...rh):Math.min(...rh)+"–"+Math.max(...rh))+"%");
  if(cc.length)parts.push("☁️ "+Math.round(cc.reduce((a,x)=>a+x,0)/cc.length)+"% облачн.");
  if(p.length)parts.push("🔽 "+Math.round(p.reduce((a,x)=>a+x,0)/p.length)+" гПа");

}

function sliderSet(v){if(v===""||v==null)return false;const n=Number(v);return Number.isFinite(n)&&n>0;}
// Конвертация старой шкалы 1–10 в 1–5 (делим на 2). Вызывается только для заданных значений.
function norm5(v){let n=Number(v);if(!Number.isFinite(n))return "";if(n>5)n=Math.round(n/2);return Math.min(5,Math.max(1,n));}
function sliderHTML(label,f,val,max,step,suffix){
  // ПОЧЕМУ НЕ ПОЛЗУНОК. Дорожка type=range врала дважды: (1) у незаполненной оценки бегунок
  // всё равно стоял ПОСЕРЕДИНЕ — глаз читал это как «уже стоит 3», хотя в данных пусто;
  // (2) тап по любому месту дорожки мгновенно писал значение, поэтому случайное касание при
  // прокрутке подставляло оценку, которую человек не ставил. touch-action:pan-y спасал только
  // от вертикального протягивания, но не от тапа. Ложная оценка хуже пустой: она попадает в
  // отчёт и создаёт неверную картину недели. Пять кнопок: пусто выглядит пусто, а записать
  // значение можно только осознанным попаданием в конкретную цифру.
  suffix=suffix||"";
  const touched=sliderSet(val);
  const v=touched?norm5(val):"";
  const disp=touched?(v+suffix):"не отмечено";
  const clr=touched?`<button style="border:none;background:none;color:#6B6B75;font-size:13px;padding:0 3px" onclick="setField('${f}','')">✕</button>`:"";
  const hint=SLIDER_HINTS[f]?`<div style="font-size:10.5px;color:#6B6B75;margin-top:3px">${SLIDER_HINTS[f]}</div>`:"";
  const dots=[1,2,3,4,5].map(n=>`<button type="button" class="sdot${touched&&v===n?" on":""}" onclick="setField('${f}',${n})">${n}</button>`).join("");
  return `<div class="slider-row${touched?"":" unset"}"><div class="slider-header"><span style="font-size:14.5px;color:#A1A1AA">${label}</span><span style="display:flex;align-items:center;gap:5px"><span class="slider-val${touched?"":" muted"}">${disp}</span>${clr}</span></div><div class="sdots">${dots}</div>${hint}</div>`;
}

// Ядро отклика: одна-три медленные волны + мягкое свечение из точки касания. Всё полупрозрачно
// и гаснет за ~1с, поэтому НИКОГДА не перекрывает название/время. Клипуется границами пункта.
function fxWave(rect,tapX,tapY,opts){
  if(reduceMotion()||!rect||rect.width<8)return;
  opts=opts||{};
  const waves=opts.waves||2,dur=opts.dur||1.0;
  const box=document.createElement("div");box.className="fx-box";
  box.style.left=rect.left+"px";box.style.top=rect.top+"px";box.style.width=rect.width+"px";box.style.height=rect.height+"px";
  document.body.appendChild(box);
  const lx=(tapX!=null?tapX-rect.left:rect.width/2),ly=(tapY!=null?tapY-rect.top:rect.height/2);
  const glow=document.createElement("div");glow.className="fx-glow";
  glow.style.setProperty("--c",opts.color||"#818CF8");glow.style.setProperty("--d",dur+"s");
  glow.style.setProperty("--gx",(lx/rect.width*100).toFixed(0)+"%");glow.style.setProperty("--gy",(ly/rect.height*100).toFixed(0)+"%");
  box.appendChild(glow);
  const dia=Math.max(rect.width,rect.height)*2.1;
  for(let i=0;i<waves;i++){
    const w=document.createElement("div");w.className="fx-wave";const sz=dia*(1-i*0.13);
    w.style.left=lx+"px";w.style.top=ly+"px";w.style.width=sz+"px";w.style.height=sz+"px";
    w.style.setProperty("--c", i===0?(opts.color||"#818CF8"):(opts.color2||opts.color||"#22D3EE"));
    w.style.setProperty("--o",(0.6-i*0.18).toFixed(2));
    w.style.setProperty("--d",(dur+i*0.12).toFixed(2)+"s");
    w.style.animationDelay=(i*0.14).toFixed(2)+"s";
    box.appendChild(w);
  }
  setTimeout(()=>{try{box.remove();}catch(_){}},(dur+waves*0.14+0.4)*1000);
}

function _fxBox(rect){const b=document.createElement("div");b.className="fx-box";b.style.left=rect.left+"px";b.style.top=rect.top+"px";b.style.width=rect.width+"px";b.style.height=rect.height+"px";document.body.appendChild(b);return b;}

function nowItems(day,wd){

// Раскладка блоков. Позиции ФИКСИРОВАННЫЕ: блок никогда не переезжает в другую колонку из-за
// того, что сосед раскрылся (прыгающие блоки — худшее, что можно сделать при СДВГ).
// Группировка смысловая: обязательное каждый день → тело и быт → ситуативное и итоги.
const BLOCK_COLS={
  2:[["din","regime","health"],["delo","state","reflect","offsched"]],
  3:[["din","regime"],["health","delo"],["state","reflect","offsched"]]
};
function layoutBlocks(blocks,cols){
  if(!(cols>=2))return `<div class="cats-wrap">${blocks.map(([,h])=>h).join("")}</div>`;
  const map=new Map(blocks);
  const plan=BLOCK_COLS[cols]||BLOCK_COLS[2];
  const used=new Set(plan.reduce((a,b)=>a.concat(b),[]));
  const extra=blocks.filter(([id])=>!used.has(id)).map(([,h])=>h).join("");
  return `<div class="cats-grid">`+plan.map((ids,i)=>
    `<div class="cats-col">${ids.map(id=>map.get(id)||"").join("")}${i===plan.length-1?extra:""}</div>`
  ).join("")+`</div>`;
}

// === Конструктор привычек: пользователь сам добавляет пункты в любой блок ===
// Кастомные пункты живут в meta.customItems и «вживляются» в CATEGORIES, поэтому все
// расчёты (баллы, счётчики, отчёт, крестик) подхватывают их автоматически.
function applyCustomItems(){
  for(const cat of CATEGORIES)cat.items=cat.items.filter(it=>!it.custom);
  for(const ci of (meta.customItems||[])){
    if(!ci||!ci.cat||!ci.label)continue;
    const cat=CATEGORIES.find(c=>c.id===ci.cat);
    if(!cat)continue;
    const it={id:ci.id,label:ci.label,type:ci.type||"ob",pts:Number(ci.pts)||0,custom:true};
    if(ci.pen&&it.type!=="fact")it.pen=1;
    if(Array.isArray(ci.sched)&&ci.sched.length>0&&ci.sched.length<7)it.sched=ci.sched.slice();
    if(ci.part)it.part=ci.part;
    cat.items.push(it);
  }
}

// LWW: \u043f\u043e\u0431\u0435\u0436\u0434\u0430\u0435\u0442 \u0446\u0435\u043b\u0438\u043a\u043e\u043c \u0442\u043e\u0442 \u0434\u0435\u043d\u044c, \u0443 \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e lastUpdated \u0431\u043e\u043b\u044c\u0448\u0435.
// \u041f\u0440\u0438 \u0440\u0430\u0432\u0435\u043d\u0441\u0442\u0432\u0435 \u0438\u043b\u0438 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0438 \u0442\u0430\u0439\u043c\u0441\u0442\u0430\u043c\u043f\u043e\u0432 \u2014 \u0431\u0435\u0440\u0451\u043c \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u0434\u0435\u043d\u044c.

// Так отметка воды с телефона и абзац рефлексии с ноута не затирают друг друга.
// Обратная совместимость: у старых дней нет day.t → падаем на day.lastUpdated (прежний LWW).
// Строим полную карту меток времени по единицам. Если у единицы есть явная метка (day.t) —
// берём её; если нет, но значение отличается от пустого — считаем, что её задали в lastUpdated

// Уникальный id строки лога. Раньше строки логов не имели id, и слияние устройств склеивало их по
// ПОЛНОМУ содержимому — из-за этого любая правка строки (пока набирал «6», «65») превращалась в
// НОВУЮ строку, и на другом устройстве всплывали десятки дублей («вес 5кг» ×45, вода по 4 раза).
// Теперь у каждой строки есть rid, и правка остаётся ОДНОЙ строкой на всех устройствах.
function newRid(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// • Строки без rid (старые данные) — по полному содержимому, как раньше (обратная совместимость).
// • dels — множество rid, удалённых на любом из устройств: они исчезают везде, а не воскресают.
// preferB=true → при конфликте одного rid берём версию из B (более свежая сторона слияния).

  // записям, а не перезаписываем целиком: обед с телефона + ужин с ноута теперь оба сохраняются.
  // Производные скаляры (water, sups, замеры) пересчитываются из объединённого лога.
  const DEL=delSet(L,I);                       // строки, удалённые на любом устройстве
  out.del=[...DEL];                            // тумбстоуны едут дальше, чтобы удаление разошлось
  for(const g in MERGE_GROUPS){
    const wI=win(g)==='I',S=wI?I:L,O=wI?L:I;
    if(g==="meals"){out.meals=mergeArr(L.meals,I.meals,wI,DEL);}
    else if(g==="spends"){out.spends=mergeArr(L.spends,I.spends,wI,DEL);}
    else if(g==="work"){out.workLog=mergeArr(L.workLog,I.workLog,wI,DEL);}
    else if(g==="proc"){out.procLog=mergeArr(L.procLog,I.procLog,wI,DEL);}
    else if(g==="water"){
      out.waterLog=mergeArr(L.waterLog,I.waterLog,wI,DEL);
      // Итог = сумма объединённого лога. Если вода вписана «итогом» без строк — берём значение
      // ПОБЕДИТЕЛЯ по метке, а не максимум: иначе воду нельзя было уменьшить (храповик).
      const sum=(out.waterLog||[]).reduce((a,x)=>a+(Number(x.ml)||0),0);
      const lump=Number(S.water)||0;
      out.water=Math.max(sum,lump);
    }
    else if(g==="sups"){
      out.supsLog=mergeArr(L.supsLog,I.supsLog,wI,DEL);
      // Так же, как с водой: из лога + «итог» победителя, без max по обеим сторонам.
      const fromLog=supSums(out.supsLog),res={},ids=new Set([...Object.keys(S.sups||{}),...Object.keys(fromLog)]);

    }
    else if(g==="meas"){
      out.measLog=dedupeMeasLog(mergeArr(L.measLog,I.measLog,wI,DEL)); // без дублей на тип+время
      const sc=measScalars(out.measLog);
      for(const f of MERGE_GROUPS.meas){if(f==="measLog")continue;const scv=sc?sc[f]:"";out[f]=(scv!==""&&scv!=null)?scv:((S[f]!==""&&S[f]!=null)?S[f]:O[f]);}
    }

  out.log=((I.log||[]).length>=(L.log||[]).length)?I.log:L.log;

  const grouped=new Set();for(const g in MERGE_GROUPS)for(const f of MERGE_GROUPS[g])grouped.add(f);

}
// Слияние meta из бэкапа: цели/задачи и кастомные БАДы — по id (без дублей), курсы — по ключу.
function mergeMetaIn(im,replace){
  if(!im||typeof im!=="object")return;
  if(Array.isArray(im.customTasks)){
    if(replace)meta.customTasks=im.customTasks.slice();
    else{const have=new Set((meta.customTasks||[]).map(t=>t.id));meta.customTasks=[...(meta.customTasks||[]),...im.customTasks.filter(t=>t&&t.id&&!have.has(t.id))];}
  }
  if(Array.isArray(im.customItems)){
    if(replace)meta.customItems=im.customItems.slice();
    else{const have=new Set((meta.customItems||[]).map(t=>t.id));meta.customItems=[...(meta.customItems||[]),...im.customItems.filter(t=>t&&t.id&&!have.has(t.id))];}
  }
  if(Array.isArray(im.userSups)){
    if(replace)meta.userSups=im.userSups.slice();
    else{const have=new Set((meta.userSups||[]).map(u=>u.id));meta.userSups=[...(meta.userSups||[]),...im.userSups.filter(u=>u&&u.id&&!have.has(u.id))];}
  }
  if(im.supPeriods&&typeof im.supPeriods==="object"){meta.supPeriods=replace?{...im.supPeriods}:{...im.supPeriods,...(meta.supPeriods||{})};}
  if(Array.isArray(im.blockers)){
    if(replace)meta.blockers=im.blockers.slice();
    else{const have=new Set((meta.blockers||[]).map(b=>b.id));meta.blockers=[...(meta.blockers||[]),...im.blockers.filter(b=>b&&b.id&&!have.has(b.id))];}
  }
  if(Array.isArray(im.blockerLog)){
    if(replace)meta.blockerLog=im.blockerLog.slice();
    else{const seen=new Set((meta.blockerLog||[]).map(x=>x.t+"|"+x.name));meta.blockerLog=[...(meta.blockerLog||[]),...im.blockerLog.filter(x=>x&&!seen.has(x.t+"|"+x.name))];}
  }
  if(Array.isArray(im.delIds)&&im.delIds.length){
    const s=new Set([...(meta.delIds||[]),...im.delIds]);meta.delIds=[...s].slice(-300);
    // Удалённое (на любом устройстве) не возвращаем даже импортом старой копии.
    const T=new Set(meta.delIds);
    for(const f of ["customTasks","customItems","userSups","blockers"])
      if(Array.isArray(meta[f]))meta[f]=meta[f].filter(x=>!(x&&T.has(x.id)));
  }

}
// «Заменить всё» — единственная кнопка в приложении, которая стирает историю целиком. Раньше она
// срабатывала С ПЕРВОГО касания и стояла вплотную к «Объединить»: промах пальцем — и дневника нет.
// Остальные удаления в приложении (привычки, задачи, БАДы, снимки) давно просят второе касание;
// эта была исключением. Теперь: подтверждение касанием + диалог с цифрами, сколько потеряется.
let importArm=false;
function applyImport(mode){if(!pendingImport)return;
  if(mode==="replace"){
    const ex=Object.keys(days).filter(isDayKey).length;
    if(ex>0){
      if(!importArm){importArm=true;vib(8);render();setTimeout(()=>{if(importArm){importArm=false;render();}},4000);return;}
      importArm=false;
      const n=Object.keys(pendingImport.days).length;
      if(!confirm("ЗАМЕНИТЬ ВСЁ?\n\nСейчас в дневнике: "+ex+" дн.\nВ файле: "+n+" дн.\n\nВсё, чего нет в файле, исчезнет навсегда.\nЕсли не уверен — жми Отмена и выбери «Объединить (без потерь)».")){render();return;}
    }
  }
  importArm=false;
  if(mode==="merge"){
    let added=0,combined=0;
    for(const k in pendingImport.days){
      if(!days[k]||dayIsEmpty(days[k])){days[k]=repairDay(pendingImport.days[k],true);added++;}
      else if(!dayIsEmpty(pendingImport.days[k])){days[k]=mergeDayDeep(days[k],repairDay(pendingImport.days[k],true));combined++;}
    }
    mergeMetaIn(pendingImport.meta,false);
    save();meta.lastBackup=Date.now();saveMeta();vib(15);pendingImport.result={added,combined};
  } else if(mode==="replace"){const nd={};for(const k in pendingImport.days)nd[k]=repairDay(pendingImport.days[k],true);days=nd;mergeMetaIn(pendingImport.meta,true);save();meta.lastBackup=Date.now();saveMeta();vib(15);}

  if(mode!=="cancel"&&wasPaste){pasteOpen=false;pasteText="";}
  render();
}
function importErrHTML(){if(!importErr)return"";return `<div class="banner banner-warn" style="border-color:#F87171"><b style="color:#F87171">Импорт не прошёл</b><div style="font-size:12.5px;margin-top:4px;color:#F5F5F7">${importErr.replace(/</g,"&lt;")}</div><button class="backup-btn" style="width:100%;margin-top:8px" onclick="importErr='';render()">Понятно</button></div>`;}
function pendingImportHTML(){if(!pendingImport)return"";const n=Object.keys(pendingImport.days).length,ex=Object.keys(days).length;const range=pendingImport.from?(pendingImport.from===pendingImport.to?pendingImport.from:pendingImport.from+" … "+pendingImport.to):"—";const warn=n<=1?`<div style="color:#FB923C;font-size:12px;margin-top:6px;line-height:1.4">⚠️ Всего ${n} день (${range}). Если ждал больше — файл, скорее всего, слит в один день. НЕ загружай, жми «Отмена».</div>`:"";const drop=pendingImport.dropped?`<div style="font-size:11px;color:#6B6B75;margin-top:4px">Пропущено записей без даты: ${pendingImport.dropped}</div>`:"";return `<div class="banner banner-warn"><b>Импорт:</b> ${n} дн. · <b>${range}</b>${ex?` · локально уже ${ex} дн.`:""}${warn}${drop}<div class="backup-row" style="margin-top:8px">${ex?`<button class="backup-btn" style="border-color:#6366F1;color:#818CF8" onclick="applyImport('merge')">Объединить (без потерь)</button>`:""}<button class="backup-btn" ${ex?(importArm?'style="border-color:#F87171;color:#F87171;background:rgba(248,113,113,.14)"':'style="border-color:#4A2020;color:#F87171"'):'style="border-color:#6366F1;color:#818CF8"'} onclick="applyImport('replace')">${ex?(importArm?"точно? сотрёт "+ex+" дн.":"Заменить всё"):"Загрузить"}</button></div><button class="backup-btn" style="margin-top:8px;width:100%" onclick="applyImport('cancel')">Отмена</button></div>`;}
function extractDays(obj){if(obj&&typeof obj==="object"&&obj.days&&typeof obj.days==="object")return obj.days;return obj;}
// Пропускаем в импорт ТОЛЬКО дни с ключом-датой ГГГГ-ММ-ДД. Мусорные ключи (поля дня и т.п.)
// отбрасываем, чтобы данные никогда не сваливались в один «день». Плюс считаем диапазон дат.
function sanitizeImportDays(raw){const out={};let dropped=0;const keys=[];for(const k in raw){if(isDayKey(k)&&raw[k]&&typeof raw[k]==="object"&&!Array.isArray(raw[k])){out[k]=raw[k];keys.push(k);}else dropped++;}keys.sort();return{out,dropped,from:keys[0]||"",to:keys[keys.length-1]||""};}
function onFile(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);const raw=extractDays(obj);if(!raw||typeof raw!=="object"||Array.isArray(raw)){importErr="Файл не похож на копию.";render();return;}const s=sanitizeImportDays(raw);if(Object.keys(s.out).length===0){importErr="В файле нет дней с датами (ключи вида ГГГГ-ММ-ДД). Похоже, это не копия дневника — импорт остановлен, твои данные не тронуты.";render();return;}pendingImport={days:s.out,meta:(obj&&obj.meta&&typeof obj.meta==="object")?obj.meta:null,dropped:s.dropped,from:s.from,to:s.to,source:"file"};render();}catch(err){importErr="Формат неверный.";render();}};rd.readAsText(f);e.target.value="";}

/* ============================================================================
   ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ — Firebase (Offline-First, Cloud-Synced)
   ----------------------------------------------------------------------------
   Философия: локальный LocalStorage — единственный источник правды для UI.
   Firebase (Firestore + Auth) — тихий фоновый транспорт между устройствами.
   • Слияние — тот же field-level LWW (mergeDayDeep + day.t). Данные минутной
     давности никогда не затираются пятиминутной давностью.
   • Никаких кнопок «синхронизировать вручную» — только тихий статус-индикатор.
   • Любая ошибка облака НИКОГДА не ломает локальную работу (всё в try/catch).
   Структура Firestore:
     users/{uid}/days/{ГГГГ-ММ-ДД}  — документ на каждый день (объект дня целиком)
     users/{uid}/meta/settings      — настройки, кастом-задачи/привычки, БАДы, блокировки
   Firebase-конфиг публичный (это норма для web-SDK) и хранится в meta.firebaseConfig —
   пользователь вставляет его один раз в настройках; редактировать HTML не нужно.
   ============================================================================ */
const FB_SDK="https://www.gstatic.com/firebasejs/11.6.1/";
cloud=(function(){
  const S={ // внутреннее состояние модуля
    fb:null,app:null,auth:null,db:null,api:null,
    user:null,ready:false,initing:false,
    authResolved:false,   // firebase ответил, вошли мы или нет (до этого судить нельзя)
    state:"off",           // off | config | connecting | synced | syncing | offline | error
    lastSync:0,lastErr:"",
    dirtyDays:new Set(),metaDirty:false,
    pushT:null,metaT:null,applying:false,unsub:null,unsubMeta:null,seeded:false
  };
  const online=()=>{try{return navigator.onLine!==false;}catch(e){return true;}};
  const clean=o=>{try{return JSON.parse(JSON.stringify(o));}catch(e){return o;}}; // срезаем undefined для Firestore
  function setState(st,err){S.state=st;if(err!=null)S.lastErr=String(err).slice(0,160);paintDot();if(settingsOpen&&!_typing()){try{render();}catch(e){}}}
  function statusText(){
    switch(S.state){
      case "off":return "не настроено";
      case "config":return effectiveFirebaseConfig()?"войдите в аккаунт":"не настроено";
      case "connecting":return "подключение…";
      case "syncing":return "синхронизация…";
      case "offline":return "офлайн — правки сохранятся и уйдут в облако позже";
      case "error":return "ошибка: "+(S.lastErr||"?");
      case "synced":return "синхронизировано"+(S.lastSync?" · "+new Date(S.lastSync).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"")+(S.user&&S.user.email?" · "+S.user.email:"");
      default:return "";
    }
  }
  function dotColor(){return {off:"",config:"#6B6B75",connecting:"#FBBF24",syncing:"#818CF8",synced:"#4ADE80",offline:"#FB923C",error:"#F87171"}[S.state]||"";}
  function paintDot(){
    try{
      const el=document.getElementById("cloud-dot");if(!el)return;
      const c=dotColor();
      if(!c||S.state==="off"){el.style.display="none";return;}
      el.style.display="block";el.style.background=c;

      el.title="Облако: "+statusText();

    }catch(e){}
  }
  // Локальная запись без цикла обратной отправки (используем при приёме удалённых изменений).
  function writeLocal(){try{const r=safeWrite(KEY,days);if(r.ok)lastWritten=JSON.stringify(days);}catch(e){}}
  // Настройки сливаем ПО-ПОЛЬНО и БЕЗ ПОТЕРЬ (как импорт), а НЕ заменяем целиком.
  // Раньше был whole-object LWW: устройство со свежей меткой затирало настройки другого — так
  // пропадали долгосрочные цели (meta.customTasks term:long) и блокировки (meta.blockers), даже когда
  // синхронизация была «зелёной». Теперь массивы объединяются по id: все элементы обеих сторон
  // сохраняются; при конфликте одного id берём более свежую сторону. Плюс, если после слияния мы

  function applyCloudMeta(rm){

    // а не воскресает при слиянии.

    };

    mergeById("customItems","id");
    mergeById("userSups","id");
    mergeById("blockers","id");

      const seen=new Set((meta.blockerLog||[]).map(x=>x&&(x.t+"|"+x.name)));
      const add=rm.blockerLog.filter(x=>x&&!seen.has(x.t+"|"+x.name));
      if(add.length){meta.blockerLog=[...(meta.blockerLog||[]),...add];changed=true;}
    }

      const merged=(rt>lt)?{...(meta.supPeriods||{}),...rm.supPeriods}:{...rm.supPeriods,...(meta.supPeriods||{})};
      if(JSON.stringify(merged)!==JSON.stringify(meta.supPeriods||{})){meta.supPeriods=merged;changed=true;}
    }

  async function ensureInit(){

  }

  function userPath(sub){return "users/"+S.user.uid+"/"+sub;}
  function daysCol(){const {collection}=S.api;return collection(S.db,userPath("days"));}
  function dayRef(k){const {doc}=S.api;return doc(S.db,userPath("days")+"/"+k);}
  function metaRef(){const {doc}=S.api;return doc(S.db,userPath("meta")+"/settings");}

  // ── КОНТУР 2: облачный автоархив. Живёт в отдельной коллекции, поэтому стирание дней
  //    (в том числе полугодовое) до него НЕ дотягивается.
// @@ОБЛАКО@@ — firebase и облачный архив
  async function pushArchiveNow(force){
      try{
        if(!S.ready||!S.user||!online())return {ok:false,why:"нет связи"};
        if(!force&&(Date.now()-(Number(meta.lastCloudArchive)||0))<ARCH_EVERY)return {ok:false,why:"рано"};
        const {doc,setDoc,getDocs,deleteDoc,collection}=S.api;
        const n=Object.keys(days).filter(isDayKey).length;
        if(!n)return {ok:false,why:"нечего архивировать"};
        const parts=archSplit(JSON.stringify(days));
        const id="a"+todayKey().replace(/-/g,"")+"_"+Date.now().toString(36);
        for(let i=0;i<parts.length;i++){
          await setDoc(doc(S.db,userPath("archparts")+"/"+id+"_"+i),{i,data:parts[i]});
        }
        await setDoc(doc(S.db,userPath("archives")+"/"+id),
          {at:Date.now(),date:todayKey(),n,parts:parts.length,v:VERSION});
        meta.lastCloudArchive=Date.now();meta.lastCloudArchiveN=n;saveMeta();
        // подчищаем старые архивы, оставляя последние ARCH_KEEP
        try{
          const snap=await getDocs(collection(S.db,userPath("archives")));
          const list=[];snap.forEach(d=>list.push({id:d.id,...d.data()}));
          list.sort((a,b)=>(b.at||0)-(a.at||0));
          for(const old of list.slice(ARCH_KEEP)){
            for(let i=0;i<(old.parts||1);i++){try{await deleteDoc(doc(S.db,userPath("archparts")+"/"+old.id+"_"+i));}catch(e){}}
            try{await deleteDoc(doc(S.db,userPath("archives")+"/"+old.id));}catch(e){}
          }
        }catch(e){logError("arch-prune",e);}
        return {ok:true,n,parts:parts.length};
      }catch(e){logError("arch-push",e);return {ok:false,why:(e&&e.message)||String(e)};}

  async function initialSync(){
    if(!S.ready||!S.user)return;
    const {getDocs,getDoc,writeBatch}=S.api;
    // 1) Тянем всё из облака и сливаем в локальные данные (LWW по единицам).
    const remote={};
    try{
      const snap=await getDocs(daysCol());
      snap.forEach(d=>{const k=d.id;if(/^\d{4}-\d{2}-\d{2}$/.test(k))remote[k]=d.data();});
    }catch(e){if(!online()){setState("offline");}else{logError("cloud-pull",e);}}
    S.applying=true;let localChanged=false;
    for(const k in remote){
      const merged=days[k]?mergeDayDeep(days[k],repairDay(remote[k])):repairDay(remote[k]);
      if(JSON.stringify(merged)!==JSON.stringify(days[k])){days[k]=merged;localChanged=true;}
    }
    if(localChanged)writeLocal();
    S.applying=false;
    // 2) Пушим в облако локальные дни, которых там нет или которые после слияния изменились.
    try{
      let batch=writeBatch(S.db),n=0,total=0;
      for(const k in days){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
        const rjson=remote[k]?JSON.stringify(remote[k]):null;
        if(rjson===JSON.stringify(days[k]))continue; // уже совпадает — не трогаем
        batch.set(dayRef(k),clean(days[k]));n++;total++;
        if(n>=400){await batch.commit();batch=writeBatch(S.db);n=0;}
      }
      if(n>0)await batch.commit();
    }catch(e){logError("cloud-seed",e);}

      const md=await getDoc(metaRef());

      if(!md.exists()||(Number(meta.metaUpdated)||0)>=(Number((md.data()||{}).metaUpdated)||0))await pushMetaNow();
      if(changed&&!_typing()){try{render();}catch(e){}}

    S.seeded=true;
    attachListeners();

    try{const r=await pushArchiveNow(false);if(r&&r.ok)logError("arch-ok","облачная копия: "+r.n+" дн.");}catch(e){}
    if(localChanged&&!_typing()){try{render();}catch(e){}}

  function attachListeners(){

      S.unsub=onSnapshot(daysCol(),{includeMetadataChanges:false},snap=>{
        try{
          let changed=false;S.applying=true;
          snap.docChanges().forEach(ch=>{
            if(ch.doc.metadata.hasPendingWrites)return; // эхо собственной записи
            const k=ch.doc.id;if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
            if(ch.type==="removed")return; // мы никогда не удаляем дни
            const remote=ch.doc.data();
            const merged=days[k]?mergeDayDeep(days[k],repairDay(remote)):repairDay(remote);
            if(JSON.stringify(merged)!==JSON.stringify(days[k])){days[k]=merged;changed=true;}
          });
          S.applying=false;
          if(changed){writeLocal();S.lastSync=Date.now();if(!settingsOpen&&!modalOpen&&!_typing()){try{render();}catch(e){}}}
          if(S.state!=="syncing")setState(online()?"synced":"offline");
        }catch(e){S.applying=false;logError("cloud-snap",e);}
      },err=>{logError("cloud-snap-err",err);setState(online()?"error":"offline",err&&err.message);});
      S.unsubMeta=onSnapshot(metaRef(),{includeMetadataChanges:false},d=>{
        try{if(d.metadata.hasPendingWrites)return;if(!d.exists())return;if(applyCloudMeta(d.data())&&!settingsOpen&&!_typing()){try{render();}catch(e){}}}catch(e){logError("cloud-metasnap",e);}

  async function flushDays(){
    if(!S.ready||!S.user||!S.seeded)return;
    if(!S.dirtyDays.size)return;
    if(!online()){setState("offline");return;}
    const {writeBatch}=S.api;
    const keys=[...S.dirtyDays];S.dirtyDays.clear();
    setState("syncing");
    try{
      let batch=writeBatch(S.db),n=0;
      for(const k of keys){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!days[k])continue;
        batch.set(dayRef(k),clean(days[k]));n++;
        if(n>=400){await batch.commit();batch=writeBatch(S.db);n=0;}
      }
      if(n>0)await batch.commit();
      S.lastSync=Date.now();setState("synced");
    }catch(e){keys.forEach(k=>S.dirtyDays.add(k));logError("cloud-push",e);setState(online()?"error":"offline",e&&e.message);}
  }

// Разбор вставленного пользователем Firebase-конфига: JSON, или JS-объект вида {apiKey:"…"},
// или сниппет "const firebaseConfig = {…};" со страницы Firebase Console.
function parseFirebaseConfig(text){
  text=String(text||"").trim();if(!text)return null;
  try{return JSON.parse(text);}catch(e){}
  const m=text.match(/\{[\s\S]*\}/);if(!m)return null;
  const body=m[0]
    .replace(/([,{]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":') // ключи без кавычек → в кавычки
    .replace(/'/g,'"')                                       // одинарные → двойные
    .replace(/,\s*([}\]])/g,'$1');                           // висячие запятые
  return JSON.parse(body);
}

/* === Авто-проверка версии ===
   Тихо запрашиваем свою же страницу с хостинга (обходя кэш) и сравниваем VERSION. Если на
   сервере новее — показываем ненавязчивую плашку «🔄 Обновить». Так пользователь не залипает
   на старой версии из кэша браузера. На file:// или без сети — просто молча ничего не делаем. */
let _lastVerCheck=0,_updShown=false;
async function checkForUpdate(){
  if(_updShown)return;
  const now=Date.now();
  if(now-_lastVerCheck<45000)return;            // не чаще раза в ~45 секунд
  _lastVerCheck=now;
  if(location.protocol==="file:")return;
  try{
    const base=location.href.split("#")[0].split("?")[0];
    const res=await fetch(base+"?vc="+now,{cache:"no-store"});
    if(!res||!res.ok)return;
    const txt=await res.text();
    const m=txt.match(/const VERSION="([^"]+)"/);
    if(m&&m[1]&&m[1]!==VERSION){_updShown=true;showUpdateBanner(m[1]);}
  }catch(e){}
}
function showUpdateBanner(v){
  try{
    if(document.getElementById("upd-bar"))return;
    const bar=document.createElement("div");bar.id="upd-bar";bar.className="upd-bar";
    const txt=document.createElement("span");txt.textContent="🔄 Новая версия "+String(v).replace(/[^0-9.]/g,"");
    const btn=document.createElement("button");btn.className="upd-go";btn.textContent="Обновить";
    btn.onclick=(e)=>{e.stopPropagation();doUpdateNow(v);};
    const x=document.createElement("button");x.className="upd-x";x.textContent="✕";
    x.onclick=(e)=>{e.stopPropagation();bar.remove();};
    bar.appendChild(txt);bar.appendChild(btn);bar.appendChild(x);
    document.body.appendChild(bar);vib(10);
  }catch(e){logError("upd-banner",e);}
}
// Жёсткая перезагрузка мимо кэша: уникальный параметр гарантирует свежую загрузку.
function doUpdateNow(v){
  // Сначала стираем кэш service worker и снимаем его с регистрации — иначе кнопка
  // «сбросить кэш» перестала бы быть правдой и человек остался бы на старой версии.
  const go=()=>{
    try{
      const base=location.href.split("#")[0].split("?")[0];
      window.location.href=base+"?v="+encodeURIComponent(v||VERSION)+"_"+Date.now();
    }catch(e){try{location.reload();}catch(_){}}
  };
  let done=false;const once=()=>{if(!done){done=true;go();}};
  setTimeout(once,1500);                       // что бы ни случилось, обновление произойдёт
  try{
    const tasks=[];
    if(window.caches&&caches.keys)tasks.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))));
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      tasks.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))));
    if(tasks.length)Promise.all(tasks).then(once,once);else once();
  }catch(e){once();}
}

      const btn=document.getElementById("rescue");
      if(btn)btn.onclick=function(){
        const ta=document.getElementById("rescue-ta");
        try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);document.execCommand("copy");btn.textContent="Скопировано ✓";}
        catch(e){btn.textContent="Выдели текст ниже и скопируй вручную";}
      };
    }
  }
};

applyCustomItems();
render();

// Просим браузер НЕ вычищать локальные данные сайта (главная причина «телефон сам всё стёр»).
// navigator.storage.persist() переводит хранилище в «persistent» режим — тогда данные не удаляются
// автоматически при нехватке места/по давности. Поддерживается не везде и не всегда гарантируется,
// поэтому это лишь дополнительный слой; настоящий бэкап — вход в облако. Тихо, без побочных эффектов.
try{
  if(navigator.storage&&navigator.storage.persist){
    navigator.storage.persisted().then(p=>{if(!p)return navigator.storage.persist();}).catch(()=>{});
  }
}catch(e){}

// ── Сверка часов с сервером ─────────────────────────────────────────────────
// Киевское время уже не зависит от часового ПОЯСА устройства, но если врут САМИ часы (села
// батарейка, сбилось время) — пересчитывать не от чего. Спрашиваем время у своего же сервера
// (заголовок Date), запоминаем поправку и применяем её дальше даже офлайн. Внешние сервисы
// не используются. Если расхождение большое — честно предупреждаем, а не молчим.
let clockWarned=false;
async function syncClock(){
  try{
    if(location.protocol==="file:")return;
    const t0=Date.now();
    const res=await fetch(location.href.split("#")[0].split("?")[0]+"?ct="+t0,{method:"HEAD",cache:"no-store"});
    if(!res||!res.ok)return;
    const hdr=res.headers.get("date");if(!hdr)return;
    const srv=Date.parse(hdr);if(!isFinite(srv))return;
    // Учитываем задержку сети: сервер отдал время где-то в середине запроса.
    const rtt=Date.now()-t0;
    const off=Math.round(srv+rtt/2-Date.now());
    const prev=Number(meta.clockOffset)||0;
    if(Math.abs(off-prev)>2000){meta.clockOffset=off;saveMeta({noStamp:true});}
    if(Math.abs(off)>10*60000&&!clockWarned){
      clockWarned=true;
      const mins=Math.round(Math.abs(off)/60000);
      try{toast("⏰ Часы устройства врут на ~"+mins+" мин — время исправлено");}catch(e){}
      try{if(!_typing())render();}catch(e){}
    }
  }catch(e){/* нет сети — работаем по последней сохранённой поправке */}
}
setTimeout(()=>{syncClock();},1500);
setInterval(()=>{if(document.visibilityState==="visible")syncClock();},60*60*1000);

// ============================================================================
// ЖИВОЕ СОХРАНЕНИЕ ЛЮБОГО ПОЛЯ ПО МЕРЕ НАБОРА (главная защита от потери данных).
// ----------------------------------------------------------------------------
// Раньше числовые/временные поля и селекты (замеры, вода, доход, сон, приёмы пищи, смены…)
// сохранялись ТОЛЬКО по onchange, а он срабатывает при потере фокуса (blur). На телефоне человек
// набирает и сворачивает приложение, не снимая фокус — blur не происходит, значение теряется.
// Теперь на контейнере #app висит ОДИН делегированный слушатель ввода: любое поле, как только в
// нём что-то меняется, тихо сохраняется на диск (через свой же onchange), но БЕЗ перерисовки
// экрана — курсор и набор текста не сбиваются. Это не зависит ни от blur, ни от событий фона,
// поэтому не полагается на «а вдруг браузер успеет». Контейнер #app переживает ре-рендеры (у него
// меняется только innerHTML), поэтому слушатель ставится один раз и работает всегда.
// textarea сюда не входят — у них своё, более лёгкое сохранение (taInput на каждый keystroke).
//
// ОТКЛЮЧЕНО (LIVE_TYPES пуст). Оказалось, что «живое сохранение» на числовых/текстовых полях
// приносило больше вреда, чем пользы: на некоторых мобильных браузерах оно задваивало ввод
// («65» → «6565») и плодило десятки промежуточных строк замеров при синхронизации. Обычные поля
// и так надёжно сохраняются: по blur (onchange) и при уходе в фон (commitFocused). Живое
// посимвольное сохранение осталось только у больших текстов (жалобы/выводы) — через taInput,
// где оно реально нужно и где этих проблем нет.
const LIVE_TYPES=new Set();
let _liveT=null,_liveEl=null;
function liveCommit(el){
  if(!el)return;
  // Ещё раз убеждаемся, что поле ВСЁ ЕЩЁ в фокусе (пользователь в нём), прежде чем сохранять.
  try{if(document.activeElement!==el)return;}catch(e){}
  try{_noRender=true;el.dispatchEvent(new Event("change",{bubbles:true}));}
  catch(e){logError("live-commit",e);}
  finally{_noRender=false;}
}
try{
  const _app=document.getElementById("app");
  if(_app)_app.addEventListener("input",e=>{
    const el=e.target;if(!el||el.tagName!=="INPUT")return;
    const ty=(el.type||"text").toLowerCase();
    if(!LIVE_TYPES.has(ty))return;                 // не range/checkbox/radio/etc.
    try{if(document.activeElement!==el)return;}catch(_){} // только активно редактируемое поле
    _liveEl=el;clearTimeout(_liveT);
    _liveT=setTimeout(()=>{const t=_liveEl;_liveEl=null;if(t)liveCommit(t);},250);
  },true);
}catch(e){logError("live-listen",e);}

// Тихо поднимаем облако после первой отрисовки — оно не должно задерживать показ экрана.
try{cloud.boot();}catch(e){logError("cloud-boot",e);}
// Раз в минуту тихо перерисовываем сегодняшний день — чтобы ритуалы сами появились/исчезли
// на границе своего окна (06/13, 19/23), без единого нажатия. При наборе текста render пропускается.
// Тихое авто-обновление ритуалов: перерисовываем НЕ каждую минуту, а только когда окно
// утра/вечера реально переключилось (≈4 раза в сутки). И не трогаем экран во время ввода,
// открытых настроек/модалки или сразу после касания — чтобы не мигнуть и не проглотить клик.
function _ritualKey(){if(sel!==todayKey())return "past";return (ritualVisible("morning")?1:0)+"|"+(ritualVisible("evening")?1:0);}
let _lastRitualKey=_ritualKey();
setInterval(()=>{
  try{
    if(sel!==todayKey()||settingsOpen||modalOpen||_typing())return;
    const k=_ritualKey();
    if(k===_lastRitualKey)return;
    if(_lastTap&&Date.now()-_lastTap.t<2000)return;
    _lastRitualKey=k;render();
  }catch(e){}
},20000);
</script>
